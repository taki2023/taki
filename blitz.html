<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot Chilli Blitz Championship — Pairings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html,
body {
  width: 100%;
  min-height: 0;
  margin: 0 !important;
  padding: 0 !important;
  background: #1a1a1a;
}
body {
  display: block !important;
  position: relative;
  top: 0 !important;
  font-family: 'Nunito', sans-serif;
}
:root {
  --cream: #FFF7F1;
  --cream-deep: #FFEADC;
  --paper: #FFFFFF;
  --ink: #6B2A1E;
  --ink-soft: #B4685A;
  --ink-faint: #E8B6A6;
  --red: #FF4433;
  --red-mid: #E0301F;
  --red-deep: #B3230F;
  --orange: #FF8A50;
  --peach: #FFD7C2;
  --line: #FFDCC9;
  --good: #34C759;
  --good-deep: #1B8A3A;
  --gold: #FFB020;
  --silver: #B8C0CC;
  --bronze: #D98A4B;
  --blue: #1D4ED8;
  --grey-band: #9AA3AF;
  --spring: cubic-bezier(.34,1.56,.64,1);
  --ease: cubic-bezier(.22,.61,.36,1);
}
.sb {
  font-family: 'Nunito', sans-serif;
  width: 100%;
  max-width: 900px;
  margin: 0 auto !important;
  padding: 0 !important;
  background: var(--cream);
  border-radius: 32px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.6) inset,
    0 20px 50px -18px rgba(179,35,15,.35);
  overflow: visible;
  isolation: isolate;
}
.sb-top {
  background:
    radial-gradient(
      120% 160% at 15% -30%,
      rgba(255,255,255,.35),
      transparent 55%
    ),
    linear-gradient(
      135deg,
      #FF5B3D 0%,
      #FF4433 45%,
      #E0301F 100%
    );
  border-radius: 32px 32px 0 0;
  padding: 16px 18px 34px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.sb-top::before {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 28px;
  background: var(--cream);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  transform: scaleX(1.3);
}
.event-title {
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 20px;
  color: #fff;
  text-shadow: 0 3px 0 rgba(150,20,10,.35);
  position: relative;
  z-index: 1;
}
.event-sub {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 9.5px;
  font-weight: 800;
  color: #fff;
  letter-spacing: .6px;
  text-transform: uppercase;
  margin-top: 10px;
  position: relative;
  z-index: 1;
  background: rgba(255,255,255,.22);
  padding: 5px 12px;
  border-radius: 999px;
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,.3);
}
.event-sub::before {
  content: '⚡';
  font-size: 11px;
}
.inner {
  width: 100%;
  margin: 0 auto;
  padding: 0 16px 20px;
}
.round-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: -16px 0 16px;
  z-index: 20;
  position: relative;
  flex-wrap: wrap;
  row-gap: 10px;
}
.round-stats {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  row-gap: 6px;
}
.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  font-weight: 800;
  color: var(--ink-soft);
  background: rgba(255,255,255,.65);
  backdrop-filter: blur(10px) saturate(1.3);
  padding: 6px 11px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
  box-shadow:
    0 0 0 1px rgba(255,220,201,.7) inset,
    0 4px 10px -6px rgba(179,35,15,.25);
}
.stat-pill .stat-num {
  color: var(--red-mid);
  font-weight: 900;
}
.round-dropdown {
  position: relative;
  z-index: 30;
  margin-left: auto;
}
.round-dropdown-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: auto;
  min-width: 150px;
  padding: 11px 16px;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,.75);
  backdrop-filter: blur(14px) saturate(1.4);
  box-shadow:
    0 10px 26px -10px rgba(179,35,15,.35),
    0 0 0 1px rgba(255,220,201,.7) inset;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 14px;
  color: var(--red-mid);
  transition: background .18s var(--ease);
}
.round-dropdown-btn:hover {
  background: #FFF1EA;
}
.round-dropdown-btn .chev {
  width: 11px;
  height: 11px;
  fill: var(--red-mid);
  transition: transform .22s var(--spring);
  flex-shrink: 0;
}
.round-dropdown.open .round-dropdown-btn .chev {
  transform: rotate(180deg);
}
.round-dropdown-list {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: max-content;
  min-width: 100%;
  max-width: 240px;
  background: var(--paper);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 16px 36px -10px rgba(224,48,31,.4),
    0 0 0 1px var(--peach);
  max-height: 280px;
  overflow-y: auto;
  opacity: 0;
  transform: translateY(-6px) scale(.98);
  pointer-events: none;
  transition:
    opacity .16s var(--ease),
    transform .16s var(--ease);
}
.round-dropdown.open .round-dropdown-list {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
.round-dropdown-item {
  padding: 12px 18px;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
  cursor: pointer;
  border-top: 1px solid var(--cream-deep);
}
.round-dropdown-item:first-child {
  border-top: none;
}
.round-dropdown-item:hover {
  background: #FFF1EA;
}
.round-dropdown-item.active {
  background:
    linear-gradient(
      135deg,
      #FF5B3D,
      var(--red-mid)
    );
  color: #fff;
}
.groups-scroll {
  width: 100%;
  max-height: 450px;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 4px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--peach) transparent;
}
.groups-scroll::-webkit-scrollbar {
  width: 7px;
}
.groups-scroll::-webkit-scrollbar-track {
  background: transparent;
}
.groups-scroll::-webkit-scrollbar-thumb {
  background: var(--peach);
  border-radius: 999px;
}
.groups-scroll::-webkit-scrollbar-thumb:hover {
  background: var(--orange);
}
#content.final-centered {
  min-height: 450px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.champion-title-plain {
  text-align: center;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.4;
  color: var(--red-mid);
  margin-bottom: 12px;
}
.champion-stats-plain {
  text-align: center;
  font-size: 11px;
  font-weight: 800;
  color: var(--ink-soft);
  line-height: 1.7;
  margin-top: 12px;
}
.champion-stats-plain .stat-sep {
  color: var(--ink-faint);
  margin: 0 8px;
}
.champion-stats-plain .stat-hl {
  color: var(--red-mid);
  font-weight: 900;
}
.group-card {
  background: var(--paper);
  border-radius: 24px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 8px 22px -10px rgba(224,48,31,.32);
  padding: 6px;
  margin-bottom: 16px;
  overflow: visible;
}
.group-card:last-child {
  margin-bottom: 4px;
}
.table-scroll {
  overflow-x: auto;
  overflow-y: visible;
  border-radius: 18px;
  -webkit-overflow-scrolling: touch;
}
.table-scroll::-webkit-scrollbar {
  height: 6px;
}
.table-scroll::-webkit-scrollbar-thumb {
  background: var(--peach);
  border-radius: 3px;
}
.table-scroll::-webkit-scrollbar-track {
  background: transparent;
}
table.pairings {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
}
table.pairings thead th {
  background:
    linear-gradient(
      135deg,
      #3a2018,
      #241009
    );
  color: #fff;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 12.5px;
  padding: 11px 5px;
  text-align: center;
  white-space: nowrap;
}
table.pairings thead th:first-child {
  text-align: left;
  padding-left: 18px;
  border-radius: 16px 0 0 0;
  width: 200px;
  min-width: 200px;
  max-width: 200px;
}
table.pairings thead th:last-child {
  border-radius: 0 16px 0 0;
}
table.pairings th:not(:first-child):not(:nth-last-child(-n+2)),
table.pairings td:not(:first-child):not(:nth-last-child(-n+2)) {
  width: 42px;
}
table.pairings th:nth-last-child(-n+2),
table.pairings td:nth-last-child(-n+2) {
  width: 52px;
}
.th-group-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
}
.th-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  background:
    linear-gradient(
      135deg,
      var(--red),
      var(--orange)
    );
}
table.pairings tbody tr {
  background: var(--paper);
  position: relative;
}
table.pairings tbody tr:nth-child(odd) {
  background: #FFFAF7;
}
table.pairings tbody tr:hover {
  background: #FFF1EA;
}
table.pairings tbody tr.band-through {
  box-shadow: inset 4px 0 0 var(--blue);
}
table.pairings tbody tr.band-out {
  box-shadow: inset 4px 0 0 var(--red-deep);
}
table.pairings tbody td {
  padding: 9px 4px;
  text-align: center;
  font-size: 12px;
  font-weight: 800;
  color: var(--ink);
  border-top: 1px solid var(--cream-deep);
  white-space: nowrap;
}
table.pairings tbody td:first-child {
  text-align: left;
  padding-left: 14px;
  width: 200px;
  min-width: 200px;
  max-width: 200px;
}
.player-cell {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.player-rank {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 11px;
  color: #fff;
  background:
    linear-gradient(
      135deg,
      var(--peach),
      var(--orange)
    );
}
table.final-round .player-rank.r1 {
  background:
    linear-gradient(
      135deg,
      var(--gold),
      #E0301F
    );
  box-shadow:
    0 2px 8px -2px rgba(255,176,32,.6);
}
table.final-round .player-rank.r2 {
  background:
    linear-gradient(
      135deg,
      var(--silver),
      #8E97A8
    );
}
table.final-round .player-rank.r3 {
  background:
    linear-gradient(
      135deg,
      var(--bronze),
      #96591F
    );
}
.player-avatar-link {
  display: inline-flex;
  flex-shrink: 0;
  border-radius: 11px;
}
.player-avatar {
  width: 32px;
  height: 36px;
  border-radius: 9px;
  border: 2px solid #fff;
  box-shadow:
    0 0 0 1.5px var(--peach);
  object-fit: cover;
  background: #FFE9DF;
  display: block;
}
.player-name {
  font-size: 12px;
  font-weight: 800;
  color: var(--red-mid);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.player-name a {
  color: inherit;
  text-decoration: none;
}
.player-name a:hover {
  text-decoration: underline;
}
.withdraw-icon {
  color: var(--red-deep);
  margin-left: 4px;
  vertical-align: middle;
  flex-shrink: 0;
}
.cell-x {
  color: var(--ink-faint);
  font-size: 16px;
  font-weight: 900;
}
.cell-board {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  outline: none;
  cursor: pointer;
}
.cell-board svg {
  fill: #9AA3AF;
  width: 19px;
  height: 19px;
  opacity: .9;
}
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
  font-family: 'Nunito', sans-serif;
  cursor: pointer;
  text-decoration: none;
  outline: none;
}
.badge.win {
  color: var(--blue);
}
.badge.draw {
  color: var(--ink-soft);
}
.badge.loss {
  color: var(--red-deep);
}
.standing-val {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 16px;
  color: var(--red-mid);
}
.tiebreak-val {
  font-family: 'Fredoka', sans-serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-soft);
}
.legend-card {
  background: var(--paper);
  border-radius: 18px;
  padding: 13px 14px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 5px 14px -6px rgba(224,48,31,.25);
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  margin-top: 14px;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--ink-soft);
}
.legend-swatch {
  width: 16px;
  height: 16px;
  border-radius: 6px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
}
.legend-swatch.win {
  color: var(--blue);
}
.legend-swatch.draw {
  color: var(--ink-soft);
}
.legend-swatch.loss {
  color: var(--red-deep);
}
.legend-swatch.pending svg {
  fill: #9AA3AF;
  width: 14px;
  height: 14px;
}
.legend-swatch.through,
.legend-swatch.eliminated {
  width: 7px;
  height: 18px;
  border-radius: 3px;
}
.legend-swatch.through {
  background: var(--blue);
}
.legend-swatch.eliminated {
  background: var(--red-deep);
}
.podium-wrap {
  margin: 0 0 14px;
  padding: 10px 8px 12px;
  border-radius: 18px;
  background: rgba(255,255,255,.7);
  box-shadow: 0 6px 18px -14px rgba(224,48,31,.3);
}
.podium-layout {
  display: flex;
  align-items: flex-end;
  gap: 12px;
}

.podium-row {
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 10px;
  padding: 0 3px;
}
.podium-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 85px;
}
.podium-medal {
  font-size: 24px;
  line-height: 1;
}
.podium-avatar {
  width: 55px;
  height: 55px;
  border-radius: 9px;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1.5px var(--peach);
  object-fit: cover;
  background: #FFE9DF;
  display: block;
}
.podium-name {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 85px;
}
.podium-step {
  width: 100%;
  border-radius: 9px 9px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 3px 5px;
  font-family: 'Fredoka', sans-serif;
}
.podium-place {
  font-size: 17px;
  font-weight: 800;
  color: rgba(255,255,255,.9);
}
.podium-block.p1 .podium-step {
  height: 53px;
  background: linear-gradient(135deg, var(--gold), #E0301F);
}
.podium-block.p2 .podium-step {
  height: 37px;
  background: linear-gradient(135deg, var(--silver), #8E97A8);
}
.podium-block.p3 .podium-step {
  height: 27px;
  background: linear-gradient(135deg, var(--bronze), #96591F);
}
.footer {
  text-align: center;
  margin-top: 6px;
  font-size: 11px;
  font-weight: 800;
  color: var(--ink-faint);
}
.load-msg {
  text-align: center;
  padding: 30px 14px;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink-soft);
}
.error-msg {
  text-align: center;
  padding: 20px 14px;
  font-size: 12px;
  font-weight: 800;
  color: var(--red-deep);
  background: #FFF1EE;
  border-radius: 14px;
  margin-bottom: 14px;
}
.table-empty {
  padding: 26px 14px;
  text-align: center;
  font-size: 12px;
  font-weight: 800;
  color: var(--ink-faint);
}
.skel {
  display: inline-block;
  border-radius: 6px;
  background:
    linear-gradient(
      90deg,
      #F1E4DB 25%,
      #FFEFE6 37%,
      #F1E4DB 63%
    );
  background-size: 400% 100%;
  animation: skel-shimmer 1.4s ease infinite;
}
@keyframes skel-shimmer {
  0% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0 50%;
  }
}
.skel-avatar {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  flex-shrink: 0;
}
.skel-rank {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  flex-shrink: 0;
}
.skel-name {
  width: 100px;
  height: 11px;
  border-radius: 5px;
}
.skel-cell {
  width: 19px;
  height: 19px;
  border-radius: 6px;
}
.skel-standing {
  width: 22px;
  height: 15px;
  border-radius: 5px;
}
.skel-tiebreak {
  width: 18px;
  height: 12px;
  border-radius: 5px;
}
#matchPopover {
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  width: 220px;
  background: var(--paper);
  border-radius: 18px;
  padding: 14px;
  box-shadow:
    0 18px 40px -12px rgba(0,0,0,.35),
    0 0 0 1px var(--peach);
  opacity: 0;
  transform:
    translateY(6px)
    scale(.97);
  transition:
    opacity .14s var(--ease),
    transform .14s var(--ease);
  font-family: 'Nunito', sans-serif;
}
#matchPopover.show {
  opacity: 1;
  transform:
    translateY(0)
    scale(1);
  pointer-events: auto;
}
.mp-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .5px;
  padding: 3px 9px;
  border-radius: 999px;
  margin-bottom: 10px;
}
.mp-status.finished {
  background: #FFF1D6;
  color: #B45309;
}
.mp-status.pending {
  background: #F1EEEE;
  color: var(--ink-soft);
}
.mp-status.partial {
  background: #FFE9DF;
  color: var(--red-mid);
}
.mp-status.forfeit {
  background: #FFE4E1;
  color: var(--red-deep);
}
.mp-teams-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 10px;
}
.mp-team {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  flex: 1;
  min-width: 0;
}
.mp-team img {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  border: 2px solid #fff;
  box-shadow:
    0 0 0 1.5px var(--peach);
  object-fit: cover;
}
.mp-team-name {
  font-size: 9px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 75px;
}
.mp-vs {
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 11px;
  color: var(--ink-faint);
  flex-shrink: 0;
  padding-top: 14px;
}
.mp-score-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 19px;
  margin-bottom: 6px;
}
.mp-score-num.win {
  color: var(--good-deep);
}

    }
    active++;

      fn,
      resolve,
      reject

    fn().then(
      value => {
        active--;
        resolve(value);
        runNext();
      },
      error => {
        active--;
        reject(error);
        runNext();
      }

        fn,

        reject

async function renderActiveRound() {
  const content =
    document.getElementById(
      'content'
    );
  const groupsScroll =
    document.querySelector(
      '.groups-scroll'
    );
  const round =
    TOURNAMENT.rounds[
      activeRoundIdx
    ];
  if (groupsScroll) {
    groupsScroll.scrollTop = 0;
  }
  if (!round) {
    content.classList.remove(
      'final-centered'
    );
    content.innerHTML = `
      <div class="load-msg">
        No round data found in the tournament data file.
      </div>
    `;
    document.getElementById(
      'roundStats'
    ).style.display = 'none';
    return;
  }
  if (!round.groups.length) {
    content.classList.remove(
      'final-centered'
    );
    content.innerHTML = `
      <div class="table-empty">
        No groups in this round yet.
      </div>
    `;
    document.getElementById(
      'roundStats'
    ).style.display = 'none';
    return;
  }
  const isLastRound =
    isFinalRound(round);
  content.classList.toggle(
    'final-centered',
    isLastRound
  );
  const statsData =
    TOURNAMENT.stats || null;
  const cardsHTML =
    (
      isLastRound
        ? championTitleHTML(
            statsData &&
            statsData.champion
          )
        : ''
    ) +
    (
      isLastRound &&
      statsData &&
      statsData.podium &&
      statsData.podium.length
        ? `<div class="podium-wrap" id="podium-final"></div>`
        : ''
    ) +
    round.groups
      .map(
        (g, gi) =>
          groupSkeletonHTML(
            g,
            gi,
            isLastRound
          )
      )
      .join('');
  content.innerHTML =
    cardsHTML;
  const matchesTotal =
    round.groups.reduce(
      (sum, g) =>
        sum + g.matches.length,
      0
    );
  resetRoundStats(
    matchesTotal
  );
  const groupStats =
    await Promise.all(
      round.groups.map(
        (g, gi) =>
          fillGroup(
            g,
            gi,
            isLastRound
          )
      )
    );
  const roundStats =
    groupStats.reduce(
      (acc, s) => ({
        matchesDone:
          acc.matchesDone +
          s.matchesDone,
        matchesTotal:
          acc.matchesTotal +
          s.matchesTotal,
        gamesDone:
          acc.gamesDone +
          s.gamesDone,
        gamesTotal:
          acc.gamesTotal +
          s.gamesTotal
      }),
      {
        matchesDone: 0,
        matchesTotal: 0,
        gamesDone: 0,
        gamesTotal: 0
      }
    );
  renderRoundStats(
    roundStats
  );
}

function qualificationBandClass(

async function fillGroup(
  group,
  gi,
  isLastRound
) {
  const players =
    group.players;
  const infos = {};
  await Promise.all(
    players.map(
      async p => {
        infos[p] =
          await fetchPlayer(p);
      }
    )
  );
  const gamesByPair = {};
  group.matches.forEach(m => {
    const rawGames =
      parseCellGames(
        m.link
      );
    const resolved =
      resolveMatchGames(
        m.playerA,
        m.playerB,
        rawGames
      );
    gamesByPair[
      m.playerA +
      '|' +
      m.playerB
    ] = {
      playerA:
        m.playerA,
      playerB:
        m.playerB,
      games:
        resolved.games,
      bothWithdrawn:
        resolved.bothWithdrawn
    };
    gamesByPair[
      m.playerB +
      '|' +
      m.playerA
    ] = {
      playerA:
        m.playerA,
      playerB:
        m.playerB,
      games:
        resolved.games,
      bothWithdrawn:
        resolved.bothWithdrawn,
      flipped: true
    };
  });
  function getPair(a, b) {
    return (
      gamesByPair[
        a + '|' + b
      ] ||
      {
        playerA: a,
        playerB: b,
        games: [],
        bothWithdrawn: false
      }
    );
  }
  const score = {};
  const sbTiebreak = {};
  players.forEach(p => {
    score[p] = 0;
    sbTiebreak[p] = 0;
  });
  let matchesDone = 0;
  let gamesDone = 0;
  let gamesTotal = 0;
  const matchesTotal =
    group.matches.length;
  group.matches.forEach(m => {
    const rec =
      gamesByPair[
        m.playerA +
        '|' +
        m.playerB
      ];
    const games =
      rec.games;
    gamesTotal += 2;
    let scoreA = 0;
    let scoreB = 0;
    if (rec.bothWithdrawn) {
      gamesDone += 2;
      matchesDone++;
    } else {
      games.forEach(g => {
        if (!isNaN(g.scoreA)) {
          scoreA += g.scoreA;
        }
        if (!isNaN(g.scoreB)) {
          scoreB += g.scoreB;
        }
        gamesDone++;
      });
      score[m.playerA] +=
        scoreA;
      score[m.playerB] +=
        scoreB;
      if (games.length >= 2) {
        matchesDone++;
      }
    }
  });
  players.forEach(p => {
    let tb = 0;
    players.forEach(opp => {
      if (opp === p) {
        return;
      }
      const rec =
        getPair(p, opp);
      const games =
        rec.games.map(
          g =>
            rec.flipped
              ? {
                  scoreA:
                    g.scoreB,
                  scoreB:
                    g.scoreA
                }
              : g
        );
      games.forEach(g => {
        if (
          !isNaN(g.scoreA) &&
          !isNaN(g.scoreB)
        ) {
          tb +=
            g.scoreA *
            score[opp];
        }
      });
    });
    sbTiebreak[p] = tb;
  });
  const order =
    players
      .slice()
      .sort(
        (x, y) =>
          (
            score[y] -
            score[x]
          ) ||
          (
            sbTiebreak[y] -
            sbTiebreak[x]
          )
      );
  if (isLastRound && gi === 0) {
    const podiumEl =
      document.getElementById(
        'podium-final'
      );
    const podiumData =
      TOURNAMENT.stats &&
      TOURNAMENT.stats.podium;
    if (
      podiumEl &&
      podiumData &&
      podiumData.length
    ) {
      podiumEl.innerHTML =
        podiumHTML(
          podiumData,
          infos
        );
    }
  }
  document.getElementById(
    'ghead-' + gi
  ).innerHTML =
    headerRowHTML(
      order.length,
      prettifyGroupName(
        group.name
      )
    );
  const tbody =
    document.getElementById(
      'gbody-' + gi
    );
  let bodyHTML = '';
  order.forEach(
    (rowSlug, rank) => {
      const info =
        infos[rowSlug] ||
        {
          name:
            prettifyUsername(
              rowSlug
            ),
          avatar:
            DEFAULT_AVATAR
        };
      const rankClass =
        rank === 0
          ? 'r1'
          : rank === 1
            ? 'r2'
            : rank === 2
              ? 'r3'
              : '';
      const bandClass =
        isLastRound
          ? ''
          : qualificationBandClass(
              rank
            );
      bodyHTML += `
        <tr class="${bandClass}">
          <td>
            <div class="player-cell">
              <div
                class="player-rank ${rankClass}"
              >
                ${rank + 1}
              </div>
              <a
                class="player-avatar-link"
                href="https://www.chess.com/member/${rowSlug}"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  class="player-avatar"
                  src="${info.avatar}"
                  onerror="this.src='${DEFAULT_AVATAR}'"
                >
              </a>
              <div class="player-name">
                <a
                  href="https://www.chess.com/member/${rowSlug}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${info.name}
                </a>
              </div>
              ${
                isWithdrawn(rowSlug)
                  ? WITHDRAW_SVG
                  : ''
              }
            </div>
          </td>
      `;
      order.forEach(
        colSlug => {
          if (
            colSlug === rowSlug
          ) {
            bodyHTML += `
              <td>
                <span class="cell-x">
                  ✕
                </span>
              </td>
            `;
            return;
          }
          const rec =
            getPair(
              rowSlug,
              colSlug
            );
          const games =
            rec.games.map(
              g =>
                rec.flipped
                  ? {
                      link: g.link,
                      scoreA:
                        g.scoreB,
                      scoreB:
                        g.scoreA,
                      dueToWithdrawal:
                        g.dueToWithdrawal
                    }
                  : g
            );
          const playedCount =
            games.filter(
              g =>
                !isNaN(g.scoreA) &&
                !isNaN(g.scoreB)
            ).length;
          let cellInner;
          if (rec.bothWithdrawn) {
            cellInner = `
              <span
                class="badge draw"

                data-b="${colSlug}"

            `;
          } else if (playedCount >= 2) {
            const totalA =

                    : totalA === 0

                )}"

                data-b="${colSlug}"

                ${formatSum(totalA)}
              </span>
            `;
          } else {
            cellInner = `
              <span
                class="cell-board"
                data-a="${rowSlug}"
                data-b="${colSlug}"

              </span>
            `;
          }
          bodyHTML += `
            <td>
              ${cellInner}
            </td>
          `;
        }
      );
      bodyHTML += `
          <td>
            <span class="standing-val">
              ${score[rowSlug]}
            </span>
          </td>
          <td>
            <span class="tiebreak-val">
              ${
                Math.round(
                  sbTiebreak[rowSlug] *
                  100
                ) / 100
              }
            </span>
          </td>
        </tr>
      `;
    }
  );
  tbody.innerHTML =
    bodyHTML;
  tbody
    .querySelectorAll(
      '[data-a][data-b]'
    )
    .forEach(el => {
      el.addEventListener(
        'mouseenter',
        e => {
          if (pinnedCellEl) {

          }
          lastMouseX =
            e.clientX;
          lastMouseY =
            e.clientY;
          headingToPopover =
            false;
          const a =
            el.dataset.a;
          const b =
            el.dataset.b;
          const rec =
            getPair(a, b);
          const games =
            rec.games.map(
              g =>
                rec.flipped
                  ? {
                      link: g.link,
                      scoreA:
                        g.scoreB,
                      scoreB:
                        g.scoreA,
                      dueToWithdrawal:
                        g.dueToWithdrawal
                    }
                  : g
            );
          const playerA =
            infos[a] ||
            {
              name:
                prettifyUsername(a),
              avatar:
                DEFAULT_AVATAR,
              username: a
            };
          const playerB =
            infos[b] ||
            {
              name:
                prettifyUsername(b),
              avatar:
                DEFAULT_AVATAR,
              username: b
            };
          const rect =
            e.currentTarget

          showPopover(
            rect.left +
            rect.width / 2,
            rect.top,
            popoverHTML(

      el.addEventListener(
        'click',
        e => {
          e.preventDefault();
          e.stopPropagation();
          const a =
            el.dataset.a;
          const b =
            el.dataset.b;
          const rec =
            getPair(a, b);
          const games =
            rec.games.map(
              g =>
                rec.flipped

                      scoreB:
                        g.scoreA,
                      dueToWithdrawal:

          const playerA =

                prettifyUsername(a),

  };
}

      <div class="error-msg">
        ⚠️ No rounds found yet in
        the tournament data file.
      </div>
    `;
    document.getElementById(
      'roundDropdown'
    ).style.display =
      'none';
    document.getElementById(
      'roundStats'
    ).style.display =
      'none';
    return;
  }
  if (!hasLoadedOnce) {
    activeRoundIdx =
      TOURNAMENT.rounds.length - 1;
    hasLoadedOnce = true;
  } else {
    activeRoundIdx =
      Math.min(
        activeRoundIdx,
        TOURNAMENT.rounds.length - 1
      );
  }
  renderRoundNav();
  await renderActiveRound();
}
boot();
</script>
</body>
</html>
