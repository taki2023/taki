<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔥 HCC City Map 🗺️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:ital,wght@0,400;0,700;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF5F0;--orange:#D93020;--border:#E8553A;--card:#FFE4DC;--text:#9A2010;--white:#fff;--blue:#4FA8D8;--deep:#2E7EB0;--gold:#F1C40F;--green:#81B64C;--shadow:0 10px 25px rgba(217,48,32,.22)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito','Segoe UI',sans-serif}
html,body{width:100%;min-width:0}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:.65rem 1rem 1.5rem;overflow-x:hidden}
.title-wrap{text-align:center;margin-bottom:.15rem;max-width:100%}
h1.map-title{font-family:'Fredoka One',cursive;color:var(--orange);font-size:1.3rem;margin-bottom:.05rem;text-shadow:1px 1px 0 rgba(0,0,0,.05);display:inline-block;position:relative;max-width:100%}
h1.map-title:after{content:'';position:absolute;left:10%;right:10%;bottom:-4px;height:4px;background:repeating-linear-gradient(90deg,var(--border) 0 10px,transparent 10px 18px);border-radius:3px;opacity:.6}
.map-viewport{position:relative;width:100%;max-width:950px;aspect-ratio:1;border:7px solid var(--border);border-radius:255px 25px 225px 25px/25px 225px 25px 255px;box-shadow:0 15px 35px rgba(217,48,32,.2);cursor:grab;touch-action:none;background:#FFF8F5;overflow:hidden;user-select:none}
.map-viewport *{user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.map-viewport.dragging{cursor:grabbing}
.map-wrapper{position:absolute;top:0;left:0;width:950px;height:950px;transform-origin:0 0;background:#FFF8F5;background-image:radial-gradient(#FFE0D6 2px,transparent 2px),radial-gradient(#FFE0D6 2px,#FFF8F5 2px);background-size:36px 36px;background-position:0 0,18px 18px;overflow:visible}
.map-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.zoom-controls{position:absolute;right:10px;bottom:10px;z-index:200;display:flex;flex-direction:column;gap:6px}
.zoom-btn{width:38px;height:38px;border-radius:9px;border:2px solid var(--border);background:#fff;color:var(--orange);font-size:1.4rem;font-weight:900;cursor:pointer;box-shadow:var(--shadow);line-height:1}
.zoom-btn:active{transform:scale(.93)}

.cloud{position:absolute;z-index:3;pointer-events:none;opacity:.6;filter:blur(1.5px);animation:cloud-drift 80s ease-in-out infinite}
.cloud.c2{animation-duration:100s;animation-delay:-30s;opacity:.5}
.cloud.c3{animation-duration:120s;animation-delay:-65s;opacity:.42}
@keyframes cloud-drift{0%,100%{transform:translateX(-25px) translateY(0)}50%{transform:translateX(35px) translateY(7px)}}

.decor-prop{position:absolute;font-size:2.8rem!important;z-index:6;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12));-webkit-text-stroke:1.3px rgba(0,0,0,.6);paint-order:stroke fill}
.decor-prop.sway{animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.decor-prop.flicker{animation:flicker 2.2s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(.94)}}

.fog{position:absolute;pointer-events:none;z-index:7;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.62) 0%,rgba(255,255,255,.43) 25%,rgba(255,255,255,.23) 52%,rgba(255,255,255,0) 78%);filter:blur(9px);opacity:.52;animation:fog-drift 27s ease-in-out infinite}
.fog:before,.fog:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.3);filter:blur(11px)}
.fog:before{width:55%;height:70%;left:-12%;top:18%}
.fog:after{width:48%;height:65%;right:-8%;top:8%}
@keyframes fog-drift{0%,100%{transform:translateX(-10px) scale(1);opacity:.38}50%{transform:translateX(24px) scale(1.08);opacity:.66}}

.secret-chilli{pointer-events:auto;cursor:pointer;animation:shimmer 4.5s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.85}50%{opacity:1;filter:drop-shadow(0 0 4px rgba(255,200,0,.6))}}
.secret-chilli.found{animation:none;opacity:.5;filter:grayscale(.6)}
.sparkle-burst{position:absolute;pointer-events:none;font-size:1.4rem;z-index:50;animation:sparkle-out .9s ease-out forwards}
@keyframes sparkle-out{0%{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:1}100%{transform:translate(-50%,-160%) scale(1.3) rotate(40deg);opacity:0}}

.waypoint{position:absolute;transform:translate(-50%,-50%);z-index:20;outline:none;cursor:pointer}
.waypoint:hover,.waypoint:focus,.waypoint:focus-within{z-index:1000}
.pin{position:relative;width:100px;height:100px;background:var(--card);border:7px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem;box-shadow:0 6px 14px rgba(0,0,0,.12);transition:transform .3s cubic-bezier(.175,.885,.32,1.275),background .2s,border-color .3s;overflow:hidden}
.pin img.pin-img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.waypoint:not(.discovered) .pin:before{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--border);opacity:.55;animation:invite-pulse 2.6s ease-out infinite}
@keyframes invite-pulse{0%{transform:scale(.9);opacity:.55}70%,100%{transform:scale(1.35);opacity:0}}
.waypoint.discovered .pin{border-color:var(--gold);background:#FFF6D8}
.badge-check{position:absolute;top:-6px;right:-6px;width:22px;height:22px;background:#4CAF50;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transform:scale(0);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.waypoint.discovered .badge-check{transform:scale(1)}
.waypoint:hover .pin,.waypoint:focus .pin{transform:scale(1.22) rotate(-4deg);border-color:var(--orange);background:#fff;box-shadow:var(--shadow)}
.waypoint.discovered:hover .pin,.waypoint.discovered:focus .pin{border-color:var(--gold)}

.btn-join{display:inline-block;padding:.5rem 1.1rem;background:var(--border);color:#fff;text-decoration:none;font-weight:bold;font-size:.9rem;border-radius:8px;transition:background .2s;align-self:flex-start}
.btn-join:hover{background:var(--orange)}
.river-flow{stroke-dasharray:14 10;animation:flow 2.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.river-highlight{stroke-dasharray:10 18;animation:river-highlight-flow 3.2s linear infinite}
@keyframes river-highlight-flow{to{stroke-dashoffset:-56}}
.rapid-svg{width:62px;height:62px;display:block;fill:var(--green);color:var(--green);stroke:#2E5C1A;stroke-width:.8}
.rapid-svg path{fill:var(--green);stroke:#2E5C1A;stroke-width:.8}

.mascot-guide{width:100%;max-width:950px;display:flex;align-items:flex-start;gap:1rem;margin-top:.65rem}
.mascot-img{width:33.333%;flex:0 0 33.333%;height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));cursor:pointer;transform-origin:bottom center;animation:mascot-idle 3.6s ease-in-out infinite}
@keyframes mascot-idle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.5deg)}}
.speech-bubble{position:relative;flex:1;min-width:0;max-width:560px;margin-top:.35rem;background:#fff;border:3px solid var(--border);border-radius:18px 18px 18px 4px;padding:1rem 1.2rem;font-size:1.1rem;font-weight:700;line-height:1.45;color:var(--text);box-shadow:var(--shadow);opacity:0;transform:translateX(-8px) scale(.96);transform-origin:left center;transition:opacity .3s,transform .3s;overflow:hidden}
.speech-bubble.show{opacity:1;transform:translateX(0) scale(1)}
.speech-bubble:after{content:'';position:absolute;top:30px;left:-16px;border-width:8px 16px 8px 0;border-style:solid;border-color:transparent var(--border) transparent transparent}

.waypoint-tooltip{width:100%;max-width:950px;margin-top:.55rem;background:#fff;border:3px solid var(--border);border-radius:16px;padding:1rem 1.3rem;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:.45rem;min-height:72px}
.tip-placeholder{font-size:.8rem;font-weight:700;color:#C98C7C}
.waypoint-tooltip.show .tip-placeholder{display:none}
.tip-title,.tip-intro,.waypoint-tooltip .btn-join{display:none;opacity:0;transition:opacity .2s}
.waypoint-tooltip.show .tip-title,.waypoint-tooltip.show .tip-intro,.waypoint-tooltip.show .btn-join{display:inline-block;opacity:1}
.tip-title{font-family:'Fredoka One',cursive;color:var(--orange);font-size:.98rem}
.tip-intro{font-size:.82rem;font-weight:800;color:#333;line-height:1.4}

@media(max-width:650px){
body{padding:.45rem .5rem 1rem}
h1.map-title{font-size:1.2rem}
.mascot-guide{gap:.7rem}
.mascot-img{width:33.333%;flex-basis:33.333%}
.speech-bubble{margin-top:.25rem;padding:.8rem 1rem}
.waypoint-tooltip{align-items:flex-start;text-align:left}
}
@media(prefers-reduced-motion:reduce){
.mascot-img,.cloud,.decor-prop.sway,.decor-prop.flicker,.secret-chilli,.fog,.waypoint:not(.discovered) .pin:before,.river-flow,.river-highlight{animation:none!important}
}
</style>
</head>

<script>
const mapViewport=document.getElementById('map-viewport'),mapWrapper=document.getElementById('map-wrapper'),mascotGuide=document.getElementById('mascot-guide');
const MAP_CENTER={x:50,y:50},R=46,SVG_SIZE=950,SVG_CENTER={x:475,y:475},SVG_R=437;
let baseScale=1,zoom=1,panX=0,panY=0,initialized=false;
const MIN_ZOOM=1,MAX_ZOOM=4;

function applyTransform(){mapWrapper.style.transform=`translate(${panX}px,${panY}px) scale(${baseScale*zoom})`}
function clampPan(){const s=baseScale*zoom,cw=950*s,ch=950*s,vw=mapViewport.clientWidth,vh=mapViewport.clientHeight,minX=Math.min(0,vw-cw),minY=Math.min(0,vh-ch);panX=Math.max(minX,Math.min(0,panX));panY=Math.max(minY,Math.min(0,panY))}
function clampZoom(z){return Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,z))}
function zoomAt(x,y,z){z=clampZoom(z);const r=mapViewport.getBoundingClientRect(),mx=x-r.left,my=y-r.top,s=baseScale*zoom,cx=(mx-panX)/s,cy=(my-panY)/s;zoom=z;s=baseScale*zoom;panX=mx-cx*s;panY=my-cy*s;clampPan();applyTransform()}
function resizeMap(){baseScale=mapViewport.clientWidth/950;if(!initialized){initialized=true;zoom=clampZoom(1.4+Math.random()*.5);const s=baseScale*zoom,minX=Math.min(0,mapViewport.clientWidth-950*s),minY=Math.min(0,mapViewport.clientHeight-950*s);panX=minX*Math.random();panY=minY*Math.random()}clampPan();applyTransform()}
new ResizeObserver(resizeMap).observe(mapViewport);

const pointers=new Map();
let dragging=false,lastX=0,lastY=0,pinchDist=0,pinchZoomStart=1,pinchMid={x:0,y:0};

mapViewport.addEventListener('pointerdown',e=>{
if(e.target.closest('.zoom-btn'))return;
if(e.pointerType!=='touch')e.preventDefault();
pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});mapViewport.setPointerCapture(e.pointerId);
if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY;mapViewport.classList.add('dragging')}
if(pointers.size===2){dragging=false;const[a,b]=[...pointers.values()];pinchDist=Math.hypot(a.x-b.x,a.y-b.y);pinchZoomStart=zoom;pinchMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
});

mapViewport.addEventListener('pointermove',e=>{
if(!pointers.has(e.pointerId))return;
pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(pointers.size===2){const[a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(pinchMid.x,pinchMid.y,pinchZoomStart*d/pinchDist);return}
if(dragging){panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;clampPan();applyTransform()}
});

function endPointer(e){pointers.delete(e.pointerId);mapViewport.classList.remove('dragging');dragging=pointers.size===1;if(dragging){const p=[...pointers.values()][0];lastX=p.x;lastY=p.y}}
['pointerup','pointercancel','pointerleave'].forEach(ev=>mapViewport.addEventListener(ev,endPointer));

mapViewport.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,zoom*(1-e.deltaY*.0015))},{passive:false});
document.getElementById('zoom-in').addEventListener('click',()=>{const r=mapViewport.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,zoom*1.4)});
document.getElementById('zoom-out').addEventListener('click',()=>{const r=mapViewport.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,zoom/1.4)});
document.getElementById('zoom-reset').addEventListener('click',()=>{zoom=1;panX=0;panY=0;clampPan();applyTransform()});

const POLAR_COORDS={courses:[0,0],traps:[.33,120],elo:[.66,90],calendar:[1,35],noobs:[1,90],rules:[.66,0],announce:[.66,35],rate:[.66,180],tiger:[1,0],hybrid:[.66,225],blitzfire:[.33,-60],heatmap:[.66,-30],daily:[1,270],votechess:[1,200],schizzarotto:[1,55]};
function polarToSvg(r,t){t*=Math.PI/180;return{x:SVG_CENTER.x+r*SVG_R*Math.cos(t),y:SVG_CENTER.y-r*SVG_R*Math.sin(t)}}
function buildPolarGuides(){
const guides=document.getElementById('polar-guides'),rays=document.getElementById('polar-rays');guides.innerHTML='';rays.innerHTML='';
[...new Set(Object.values(POLAR_COORDS).map(x=>Number(x[0].toFixed(6))).filter(x=>x>0))].sort((a,b)=>a-b).forEach(r=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',SVG_CENTER.x);c.setAttribute('cy',SVG_CENTER.y);c.setAttribute('r',r*SVG_R);c.setAttribute('stroke-width','8');c.setAttribute('stroke-dasharray','4 10');guides.appendChild(c)});
const groups=new Map();
Object.entries(POLAR_COORDS).forEach(([id,[r,t]])=>{if(r<=0)return;t=((t%360)+360)%360;if(!groups.has(t))groups.set(t,{theta:t,maxR:r});else groups.get(t).maxR=Math.max(groups.get(t).maxR,r)});
groups.forEach(g=>{const e=polarToSvg(g.maxR,g.theta),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',SVG_CENTER.x);l.setAttribute('y1',SVG_CENTER.y);l.setAttribute('x2',e.x);l.setAttribute('y2',e.y);rays.appendChild(l)})
}
function positionWell(){const p=polarToSvg(.33,0);document.getElementById('central-well').setAttribute('transform',`translate(${p.x},${p.y})`)}
buildPolarGuides();positionWell();

const WAYPOINTS=[

{id:'votechess',icon:'🗳️',title:'🗳️ Vote Chess',intro:'Discuss, learn, vote! Spicy Vote Chess games!',link:'https://www.chess.com/club/votechess/hot-chilli-checkmate',linkLabel:'Cast Vote',hover:'Democracy, chilli-style, happens over there 🗳️',discover:'You found the Voting Hall! Every voice counts here 🗳️'},
{id:'daily',icon:'☀️',title:'☀️ Daily Matches',intro:'Take as much time as you want, slow paced, accurate chess!',link:'https://www.chess.com/clubs/matches/hot-chilli-checkmate',linkLabel:'Play Daily',hover:'Slow and steady wins under that sun ☀️',discover:'You found Sunny Fields, home of the patient grinders ☀️'},

{id:'rules',icon:'📜',title:'📜 Club Rules',intro:'Check our club rules here!',link:'https://www.chess.com/clubs/forum/view/rules-for-the-competitive-side-of-the-club',linkLabel:'View Rules',hover:'Better not skip the scroll over there 📜',discover:'You found the Rules Scroll! Now you know the law 📜'},

{id:'blitzfire',svg:`<svg class="rapid-svg" viewBox="0 0 24 24"><path d="m11.97 14.63c-.9 0-1.87-.73-1.5-2.23l1.03-4.4h1l1.03 4.37c.37 1.53-.63 2.27-1.57 2.27zm.03 7.87c-5.23 0-9.5-4.27-9.5-9.5s4.27-9.5 9.5-9.5 9.5 4.27 9.5 9.5-4.27 9.5-9.5 9.5zm0-3c4 0 6.5-2.5 6.5-6.5s-2.5-6.5-6.5-6.5-6.5 2.5-6.5 6.5 2.5 6.5 6.5 6.5zm-1.5-14.27v-4.23h3v4.23zm5-3.23h-7c0-1.7.43-2 3.5-2s3.5.3 3.5 2z"/></svg>`,title:'🏆 Hot Chilli Rapid Championship',intro:'The Rapid Championship pairings are ready!',link:'https://www.chess.com/announcements/view/hot-chilli-rapid-championship-pairings',linkLabel:'Open Pairings',hover:'A new championship is heating up... Rapid style! 🟢🏆',discover:'You found the Hot Chilli Rapid Championship pairings! 🏆♟️'}

const IDLE_LINES=['Psst... I heard there is a secret treasure hidden somewhere in the city 👀🌶️','Careful! The Tricky Opening District is dangerous ♟️',"It's getting hot around here... 🔥",'Rumor says a hidden chilli appears after midnight 🌶️👀','Fifteen places to explore... have you found them all?','The library never closes, you know 📚','I once got lost near the Voting Hall for three days 🗳️😅',"Come on, click around, the map won't bite! 🗺️",'Every alley here has a story. Go find one 🌶️'];
const SECRET_LINES=['WAIT. You actually found it?! The secret chilli! 🌶️✨ Nobody ever looks behind the palm trees...'];

WAYPOINTS.forEach(wp=>{
const el=document.createElement('div');el.className='waypoint';el.tabIndex=0;el.dataset.id=wp.id;
const[r,t]=POLAR_COORDS[wp.id]||[0,0],a=t*Math.PI/180,rad=r*R;
el.style.left=MAP_CENTER.x+rad*Math.cos(a)+'%';el.style.top=MAP_CENTER.y-rad*Math.sin(a)+'%';
el.innerHTML=`<div class="pin">${wp.image?`<img class="pin-img" src="${wp.image}" alt="${wp.title}">`:wp.svg||wp.icon}<span class="badge-check">✓</span></div>`;
mapWrapper.appendChild(el);
el.addEventListener('mouseenter',()=>{sayHover(wp);showTooltip(wp)});
el.addEventListener('focus',()=>{sayHover(wp);showTooltip(wp)});
el.addEventListener('mouseleave',()=>{scheduleIdle();hideTooltip()});
el.addEventListener('blur',()=>{scheduleIdle();hideTooltip()})
});

const STORAGE_KEY='hcc_map_discovered',SECRET_KEY='hcc_map_secret_found';
function loadDiscovered(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch(e){return[]}}
function saveDiscovered(x){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(x))}catch(e){}}
function updateProgressPill(){}
function applySavedState(){loadDiscovered().forEach(id=>{const el=mapWrapper.querySelector(`.waypoint[data-id="${id}"]`);if(el)el.classList.add('discovered')});if(localStorage.getItem(SECRET_KEY))document.getElementById('secret-chilli').classList.add('found');updateProgressPill()}
function discover(wp){
const el=mapWrapper.querySelector(`.waypoint[data-id="${wp.id}"]`),already=el.classList.contains('discovered');el.classList.add('discovered');
if(!already){const list=loadDiscovered();if(!list.includes(wp.id)){list.push(wp.id);saveDiscovered(list);updateProgressPill()}}
tooltip.classList.remove('show');say(wp.discover,4200)
}

const bubble=document.getElementById('speech-bubble');
let idleTimer=null,hoverActive=false;
const BUBBLE_MAX_PX=17.6,BUBBLE_MIN_PX=10,BUBBLE_LINE_HEIGHT=1.45,BUBBLE_MAX_LINES=3;
function fitBubbleText(){let s=BUBBLE_MAX_PX;bubble.style.fontSize=s+'px';while(bubble.scrollHeight>s*BUBBLE_LINE_HEIGHT*BUBBLE_MAX_LINES+2&&s>BUBBLE_MIN_PX){s=Math.max(BUBBLE_MIN_PX,s-.5);bubble.style.fontSize=s+'px'}}
function say(text,holdMs){bubble.textContent=text;bubble.classList.add('show');fitBubbleText();clearTimeout(idleTimer);idleTimer=setTimeout(()=>{bubble.classList.remove('show');if(!hoverActive)scheduleIdle(true)},holdMs||6000)}
function sayHover(wp){hoverActive=true;clearTimeout(idleTimer);bubble.textContent=wp.hover;bubble.classList.add('show');fitBubbleText()}
let bubbleResizeTimer=null;
function scheduleBubbleFit(){clearTimeout(bubbleResizeTimer);bubbleResizeTimer=setTimeout(fitBubbleText,120)}
window.addEventListener('resize',scheduleBubbleFit);
new ResizeObserver(scheduleBubbleFit).observe(mascotGuide);
function scheduleIdle(immediate){hoverActive=false;clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(!hoverActive)say(IDLE_LINES[Math.floor(Math.random()*IDLE_LINES.length)],5500)},immediate?3000:800)}
document.getElementById('mascot-img').addEventListener('click',()=>say(IDLE_LINES[Math.floor(Math.random()*IDLE_LINES.length)],5000));

const tooltip=document.getElementById('waypoint-tooltip'),tipTitleEl=document.getElementById('tip-title'),tipIntroEl=document.getElementById('tip-intro'),tipJoinEl=document.getElementById('tip-join');
let hideTimer=null;
function cancelHide(){if(hideTimer){clearTimeout(hideTimer);hideTimer=null}}
function showTooltip(wp){cancelHide();tipTitleEl.textContent=wp.title;tipIntroEl.textContent=wp.intro;tipJoinEl.textContent=wp.linkLabel;tipJoinEl.href=wp.link;tipJoinEl.onclick=()=>discover(wp);tooltip.classList.add('show')}
function hideTooltip(){cancelHide();hideTimer=setTimeout(()=>tooltip.classList.remove('show'),150)}
tooltip.addEventListener('mouseenter',cancelHide);
tooltip.addEventListener('mouseleave',hideTooltip);
tipJoinEl.addEventListener('focus',cancelHide);
tipJoinEl.addEventListener('blur',hideTooltip);

const secretEl=document.getElementById('secret-chilli');
secretEl.addEventListener('click',e=>{
if(!localStorage.getItem(SECRET_KEY)){try{localStorage.setItem(SECRET_KEY,'1')}catch(err){}secretEl.classList.add('found');updateProgressPill();burstSparkles(e);say(SECRET_LINES[0],6000)}
else{burstSparkles(e);say('You already claimed this one, champion 🌶️🏆',4000)}
});
function burstSparkles(e){
const rect=mapWrapper.getBoundingClientRect(),scale=baseScale*zoom,x=(e.clientX-rect.left)/scale,y=(e.clientY-rect.top)/scale,symbols=['✨','🌟','💥','🎉'];
for(let i=0;i<6;i++){const s=document.createElement('span');s.className='sparkle-burst';s.textContent=symbols[Math.floor(Math.random()*symbols.length)];s.style.left=x+(Math.random()*60-30)+'px';s.style.top=y+(Math.random()*20-10)+'px';mapWrapper.appendChild(s);setTimeout(()=>s.remove(),950)}
}

applySavedState();
setTimeout(()=>say(IDLE_LINES[0],6000),900);
scheduleIdle(true);
</script>
