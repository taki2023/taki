<title>🔥 HCC City Map 🗺️</title>

<style>
:root{--bg-peach:#FFF5F0;--path-orange:#E85535;--accent-orange:#D93020;--card-bg:#FFE4DC;--border-orange:#E8553A;--text-dark:#9A2010;--white:#FFFFFF;--river-blue:#4FA8D8;--river-deep:#2E7EB0;--gold:#F1C40F;--rapid-green:#81B64C;--shadow:0 10px 25px rgba(217,48,32,0.22);}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
html,body{width:100%;min-width:0;}
body{background-color:var(--bg-peach);color:var(--text-dark);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:2rem 1rem;overflow-x:hidden;}
.title-wrap{position:relative;text-align:center;margin-bottom:0.4rem;max-width:100%;}
h1.map-title{font-family:'Fredoka One',cursive;color:var(--accent-orange);font-size:1.4rem;text-align:center;margin-bottom:0.3rem;text-shadow:1px 1px 0px rgba(0,0,0,0.05);position:relative;display:inline-block;max-width:100%;}

.map-viewport{position:relative;width:100%;max-width:950px;aspect-ratio:1/1;overflow:hidden;border:7px solid #E85535;border-radius:255px 25px 225px 25px/25px 225px 25px 255px;box-shadow:0 15px 35px rgba(217,48,32,0.2);cursor:grab;touch-action:none;background:#FFF8F5;user-select:none;-webkit-user-select:none;-ms-user-select:none;-webkit-touch-callout:none;}
.map-viewport *{user-select:none;-webkit-user-select:none;-ms-user-select:none;-webkit-user-drag:none;}
.map-viewport.dragging{cursor:grabbing;}
.map-wrapper{position:absolute;top:0;left:0;width:950px;height:950px;transform-origin:0 0;background-color:#FFF8F5;background-image:radial-gradient(#FFE0D6 2px,transparent 2px),radial-gradient(#FFE0D6 2px,#FFF8F5 2px);background-size:36px 36px;background-position:0 0,18px 18px;overflow:visible;}
.map-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.zoom-controls{position:absolute;right:10px;bottom:10px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:auto;}
.zoom-btn{width:38px;height:38px;border-radius:9px;border:2px solid var(--border-orange);background:#fff;color:var(--accent-orange);font-size:1.4rem;font-weight:900;cursor:pointer;box-shadow:var(--shadow);line-height:1;pointer-events:auto;}
.zoom-btn:active{transform:scale(0.93);}
.cloud{position:absolute;z-index:1;pointer-events:none;opacity:0.55;filter:blur(0.5px);animation:drift 60s linear infinite;}
.cloud.c2{animation-duration:80s;animation-delay:-20s;}
.cloud.c3{animation-duration:100s;animation-delay:-50s;}
@keyframes drift{0%{transform:translateX(-40px);}50%{transform:translateX(30px);}100%{transform:translateX(-40px);}}
.decor-prop{position:absolute;font-size:2.8rem!important;z-index:1;pointer-events:none;user-select:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.12));-webkit-text-stroke:1.3px rgba(0,0,0,0.6);paint-order:stroke fill;}
.decor-prop.sway{animation:sway 5s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
.decor-prop.flicker{animation:flicker 2.2s ease-in-out infinite;}
@keyframes flicker{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.75;transform:scale(0.94);}}
.decor-prop.leaf-fall{animation:leaf-fall 6.5s ease-in-out infinite;}
@keyframes leaf-fall{0%{transform:translateY(0) rotate(-8deg);}50%{transform:translateY(10px) rotate(10deg);}100%{transform:translateY(0) rotate(-8deg);}}
.fog{position:absolute;pointer-events:none;z-index:2;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,0.65) 0%,rgba(255,255,255,0.3) 45%,rgba(255,255,255,0) 75%);filter:blur(5px);animation:fog-drift 20s ease-in-out infinite;}
@keyframes fog-drift{0%,100%{transform:translateX(0) scale(1);opacity:0.45;}50%{transform:translateX(16px) scale(1.06);opacity:0.7;}}
.secret-chilli{pointer-events:auto;cursor:pointer;animation:shimmer 4.5s ease-in-out infinite;}
@keyframes shimmer{0%,100%{opacity:0.85;}50%{opacity:1;filter:drop-shadow(0 0 4px rgba(255,200,0,0.6));}}
.secret-chilli.found{animation:none;opacity:0.5;filter:grayscale(0.6);}
.sparkle-burst{position:absolute;pointer-events:none;font-size:1.4rem;z-index:50;animation:sparkle-out 0.9s ease-out forwards;}
@keyframes sparkle-out{0%{transform:translate(-50%,-50%) scale(0.3) rotate(0deg);opacity:1;}100%{transform:translate(-50%,-160%) scale(1.3) rotate(40deg);opacity:0;}}
.waypoint{position:absolute;transform:translate(-50%,-50%);z-index:20;outline:none;cursor:pointer;}
.waypoint:hover,.waypoint:focus,.waypoint:focus-within{z-index:1000;}
.waypoint.active-hover{z-index:1000;}
.pin{position:relative;width:100px;height:100px;background:var(--card-bg);border:7px solid var(--border-orange);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem;box-shadow:0 6px 14px rgba(0,0,0,0.12);transition:transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275),background 0.2s,border-color 0.3s;overflow:hidden;}
.pin img.pin-img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.waypoint:not(.discovered) .pin::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--border-orange);opacity:0.55;animation:invite-pulse 2.6s ease-out infinite;}
@keyframes invite-pulse{0%{transform:scale(0.9);opacity:0.55;}70%,100%{transform:scale(1.35);opacity:0;}}
.waypoint.discovered .pin{border-color:var(--gold);background:#FFF6D8;}
.badge-check{position:absolute;top:-6px;right:-6px;width:22px;height:22px;background:#4CAF50;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;border:2px solid var(--white);box-shadow:0 2px 5px rgba(0,0,0,0.2);transform:scale(0);transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);}
.waypoint.discovered .badge-check{transform:scale(1);}
.waypoint:hover .pin,.waypoint:focus .pin,.waypoint.active-hover .pin{transform:scale(1.22) rotate(-4deg);border-color:var(--accent-orange);background:var(--white);box-shadow:var(--shadow);}
.waypoint.discovered:hover .pin,.waypoint.discovered:focus .pin,.waypoint.discovered.active-hover .pin{border-color:var(--gold);}
.btn-join{display:inline-block;padding:0.5rem 1.1rem;background-color:var(--border-orange);color:var(--white);text-decoration:none;font-weight:bold;font-size:0.9rem;border-radius:8px;transition:background 0.2s ease;align-self:flex-start;}
.btn-join:hover{background-color:var(--accent-orange);}
.river-flow{stroke-dasharray:14 10;animation:flow 2.2s linear infinite;}
@keyframes flow{to{stroke-dashoffset:-48;}}
.river-highlight{stroke-dasharray:10 18;animation:river-highlight-flow 3.2s linear infinite;}
@keyframes river-highlight-flow{to{stroke-dashoffset:-56;}}
.rapid-svg{width:62px;height:62px;display:block;flex:0 0 auto;fill:var(--rapid-green);color:var(--rapid-green);stroke:#2E5C1A;stroke-width:0.8;}
.rapid-svg path{fill:var(--rapid-green);stroke:#2E5C1A;stroke-width:0.8;}
.mascot-guide{width:100%;max-width:950px;display:flex;align-items:flex-start;gap:1.2rem;margin-top:1.1rem;}
.mascot-img{width:33.333%;flex:0 0 33.333%;height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,0.25));cursor:pointer;transform-origin:bottom center;animation:mascot-idle 3.6s ease-in-out infinite;}
@keyframes mascot-idle{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-5px) rotate(-1.5deg);}}
.speech-bubble{position:relative;flex:1 1 auto;min-width:0;max-width:560px;margin-top:0.5rem;background:var(--white);border:3px solid var(--border-orange);border-radius:18px 18px 18px 4px;padding:1.1rem 1.4rem;font-size:1.1rem;font-weight:700;line-height:1.45;color:var(--text-dark);box-shadow:var(--shadow);opacity:0;transform:translateX(-8px) scale(0.96);transform-origin:left center;transition:opacity 0.3s ease,transform 0.3s ease;overflow:hidden;}
.speech-bubble.show{opacity:1;transform:translateX(0) scale(1);}
.speech-bubble::after{content:'';position:absolute;top:30px;left:-16px;border-width:8px 16px 8px 0;border-style:solid;border-color:transparent var(--border-orange) transparent transparent;}
.waypoint-tooltip{width:100%;max-width:950px;margin-top:0.9rem;background:var(--white);border:3px solid var(--border-orange);border-radius:16px;padding:1.1rem 1.4rem;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0.5rem;min-height:76px;}
.tip-placeholder{font-size:0.8rem;font-weight:700;color:#C98C7C;transition:opacity 0.2s ease;}
.waypoint-tooltip.show .tip-placeholder{display:none;}
.tip-title,.tip-intro,.waypoint-tooltip .btn-join{display:none;opacity:0;transition:opacity 0.2s ease;}
.waypoint-tooltip.show .tip-title,.waypoint-tooltip.show .tip-intro,.waypoint-tooltip.show .btn-join{display:inline-block;opacity:1;}
.tip-title{font-family:'Fredoka One',cursive;color:var(--accent-orange);font-size:.98rem;}
.tip-intro{font-size:0.82rem;font-weight:800;color:#333;line-height:1.4;}
@media (max-width:650px){body{padding-left:0.5rem;padding-right:0.5rem;}h1.map-title{font-size:1.3rem;}.mascot-guide{flex-direction:row;align-items:flex-start;text-align:left;}.speech-bubble{margin-top:0.5rem;max-width:100%;}.waypoint-tooltip{align-items:flex-start;text-align:left;}}
@media (prefers-reduced-motion:reduce){.mascot-img,.cloud,.decor-prop.sway,.decor-prop.flicker,.decor-prop.leaf-fall,.secret-chilli,.fog,.waypoint:not(.discovered) .pin::before,.river-flow,.river-highlight{animation:none!important;}}
</style>

<script>
const mapViewport=document.getElementById('map-viewport'),mapWrapper=document.getElementById('map-wrapper'),mascotGuide=document.getElementById('mascot-guide');
const MAP_CENTER={x:50,y:50},R=46.0,SVG_SIZE=950,SVG_CENTER={x:SVG_SIZE*MAP_CENTER.x/100,y:SVG_SIZE*MAP_CENTER.y/100},SVG_R=SVG_SIZE*R/100;
let baseScale=1,zoom=1,panX=0,panY=0;
const MIN_ZOOM=1,MAX_ZOOM=4;

function applyTransform(){mapWrapper.style.transform=`translate(${panX}px,${panY}px) scale(${baseScale*zoom})`;}
function clampPan(){
  const s=baseScale*zoom,cw=950*s,ch=950*s,vw=mapViewport.clientWidth,vh=mapViewport.clientHeight;
  const minX=Math.min(0,vw-cw),minY=Math.min(0,vh-ch);
  panX=Math.max(minX,Math.min(0,panX));
  panY=Math.max(minY,Math.min(0,panY));
}
function clampZoom(z){return Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,z));}
function zoomAt(clientX,clientY,newZoom){
  newZoom=clampZoom(newZoom);
  const rect=mapViewport.getBoundingClientRect(),mx=clientX-rect.left,my=clientY-rect.top;
  const scaleBefore=baseScale*zoom,contentX=(mx-panX)/scaleBefore,contentY=(my-panY)/scaleBefore;
  zoom=newZoom;
  const scaleAfter=baseScale*zoom;
  panX=mx-contentX*scaleAfter;
  panY=my-contentY*scaleAfter;
  clampPan();applyTransform();
}
let initialized=false;
function resizeMap(){
  baseScale=mapViewport.clientWidth/950;
  if(!initialized){
    initialized=true;
    zoom=clampZoom(1.4+Math.random()*0.5);
    const s=baseScale*zoom,cw=950*s,ch=950*s,vw=mapViewport.clientWidth,vh=mapViewport.clientHeight;
    const minX=Math.min(0,vw-cw),minY=Math.min(0,vh-ch);
    panX=minX*Math.random();
    panY=minY*Math.random();
  }
  clampPan();applyTransform();
}
new ResizeObserver(resizeMap).observe(mapViewport);

const pointers=new Map();
let dragging=false,lastX=0,lastY=0,pinchDist=0,pinchZoomStart=1,pinchMid={x:0,y:0};
function zoomButton(factor){const r=mapViewport.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,zoom*factor);}
document.getElementById('zoom-in').onclick=e=>{e.stopPropagation();zoomButton(1.4);};
document.getElementById('zoom-out').onclick=e=>{e.stopPropagation();zoomButton(1/1.4);};
document.getElementById('zoom-reset').onclick=e=>{e.stopPropagation();zoom=1;panX=0;panY=0;clampPan();applyTransform();};
mapViewport.addEventListener('pointerdown',e=>{
  if(e.target.closest('.zoom-controls'))return;
  e.preventDefault();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY;mapViewport.classList.add('dragging');}
  if(pointers.size===2){dragging=false;const[a,b]=[...pointers.values()];pinchDist=Math.hypot(a.x-b.x,a.y-b.y);pinchZoomStart=zoom;pinchMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
});
mapViewport.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const[a,b]=[...pointers.values()],dist=Math.hypot(a.x-b.x,a.y-b.y);if(pinchDist>0)zoomAt(pinchMid.x,pinchMid.y,pinchZoomStart*(dist/pinchDist));return;}
  if(dragging){panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;clampPan();applyTransform();}
});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size===0){dragging=false;mapViewport.classList.remove('dragging');}if(pointers.size===1){const p=[...pointers.values()][0];dragging=true;lastX=p.x;lastY=p.y;}}
mapViewport.addEventListener('pointerup',endPointer);
mapViewport.addEventListener('pointercancel',endPointer);
mapViewport.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,zoom*(1-e.deltaY*.0015));},{passive:false});

const POLAR_COORDS={courses:[0,0],traps:[0.33,120],elo:[0.66,90],calendar:[1,35],noobs:[1,90],rules:[0.66,0],announce:[0.66,35],rate:[0.66,180],tiger:[1,0],hybrid:[0.66,225],blitzfire:[0.33,-60],heatmap:[0.66,-30],daily:[1,270],votechess:[1,200],schizzarotto:[1,55]};
function polarToSvg(rFraction,thetaDeg){const theta=thetaDeg*Math.PI/180,radius=rFraction*SVG_R;return{x:SVG_CENTER.x+radius*Math.cos(theta),y:SVG_CENTER.y-radius*Math.sin(theta)};}

function buildPolarGuides(){
  const guides=document.getElementById('polar-guides'),rays=document.getElementById('polar-rays');
  guides.innerHTML='';rays.innerHTML='';
  const radii=[...new Set(Object.values(POLAR_COORDS).map(([r])=>Number(r.toFixed(6))).filter(r=>r>0))].sort((a,b)=>a-b);
  radii.forEach(rFraction=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',SVG_CENTER.x);c.setAttribute('cy',SVG_CENTER.y);c.setAttribute('r',rFraction*SVG_R);c.setAttribute('stroke-width','8');c.setAttribute('stroke-dasharray','4 10');
    guides.appendChild(c);
  });
  const angleGroups=new Map();
  Object.entries(POLAR_COORDS).forEach(([id,[rFraction,thetaDeg]])=>{
    if(rFraction<=0)return;
    let n=Math.round((((thetaDeg%360)+360)%360)*1000)/1000;
    if(!angleGroups.has(n))angleGroups.set(n,{theta:thetaDeg,maxR:rFraction});
    else{const g=angleGroups.get(n);if(rFraction>g.maxR)g.maxR=rFraction;}
  });
  angleGroups.forEach(group=>{
    const end=polarToSvg(group.maxR,group.theta);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',SVG_CENTER.x);line.setAttribute('y1',SVG_CENTER.y);line.setAttribute('x2',end.x);line.setAttribute('y2',end.y);
    rays.appendChild(line);
  });
}
function positionWell(){const pos=polarToSvg(0.33,0);document.getElementById('central-well').setAttribute('transform',`translate(${pos.x},${pos.y})`);}
buildPolarGuides();positionWell();

const IDLE_LINES=["Psst... I heard there is a secret treasure hidden somewhere in the city 👀🌶️","Careful! The Tricky Opening District is dangerous ♟️","It's getting hot around here... 🔥","Rumor says a hidden chilli appears after midnight 🌶️👀","Fifteen places to explore... have you found them all?","The library never closes, you know 📚","I once got lost near the Voting Hall for three days 🗳️😅","Come on, click around, the map won't bite! 🗺️","Every alley here has a story. Go find one 🌶️"];
const SECRET_LINES=["WAIT. You actually found it?! The secret chilli! 🌶️✨ Nobody ever looks behind the palm trees..."];

let activeWaypointEl=null;

WAYPOINTS.forEach(wp=>{
  const el=document.createElement('div');
  el.className='waypoint';el.tabIndex=0;el.dataset.id=wp.id;
  const[rFraction,thetaDeg]=POLAR_COORDS[wp.id]||[0,0];
  const theta=thetaDeg*Math.PI/180,radius=rFraction*R;
  el.style.left=(MAP_CENTER.x+radius*Math.cos(theta))+'%';
  el.style.top=(MAP_CENTER.y-radius*Math.sin(theta))+'%';
  const pinContent=wp.image?`<img class="pin-img" src="${wp.image}" alt="${wp.title}">`:(wp.svg?wp.svg:wp.icon);
  el.innerHTML=`<div class="pin">${pinContent}<span class="badge-check">✓</span></div>`;
  mapWrapper.appendChild(el);
  el.addEventListener('mouseenter',()=>{activateWaypoint(wp,el);});
  el.addEventListener('focus',()=>{activateWaypoint(wp,el);});
});

function activateWaypoint(wp,el){
  if(activeWaypointEl&&activeWaypointEl!==el)activeWaypointEl.classList.remove('active-hover');
  el.classList.add('active-hover');
  activeWaypointEl=el;
  sayHover(wp);
  showTooltip(wp);
}

const STORAGE_KEY='hcc_map_discovered',SECRET_KEY='hcc_map_secret_found',SECRET_SPOT_KEY='hcc_map_secret_spot';
const TODAY_KEY=new Date().toISOString().slice(0,10);
const SECRET_SPOTS=[{top:44,left:14},{top:16,left:52},{top:63,left:8},{top:8,left:86},{top:36,left:76},{top:60,left:58},{top:81,left:24},{top:26,left:33},{top:70,left:69},{top:14,left:23},{top:50,left:90},{top:90,left:56}];
function dailySeed(){
  const d=new Date();
  return d.getFullYear()*372+d.getMonth()*31+d.getDate();
}
function positionSecretChilli(){
  const spot=SECRET_SPOTS[dailySeed()%SECRET_SPOTS.length];
  const el=document.getElementById('secret-chilli');
  el.style.top=spot.top+'%';
  el.style.left=spot.left+'%';
}
function loadDiscovered(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch(e){return[];}}
function saveDiscovered(list){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(list));}catch(e){}}
function updateProgressPill(){}
function applySavedState(){
  loadDiscovered().forEach(id=>{const el=mapWrapper.querySelector(`.waypoint[data-id="${id}"]`);if(el)el.classList.add('discovered');});
  positionSecretChilli();
  if(localStorage.getItem(SECRET_KEY)===TODAY_KEY)document.getElementById('secret-chilli').classList.add('found');
  else document.getElementById('secret-chilli').classList.remove('found');
  updateProgressPill();
}
function discover(wp){
  const el=mapWrapper.querySelector(`.waypoint[data-id="${wp.id}"]`);
  const already=el.classList.contains('discovered');
  el.classList.add('discovered');
  if(!already){
    const list=loadDiscovered();
    if(!list.includes(wp.id)){list.push(wp.id);saveDiscovered(list);updateProgressPill();}
  }
  say(wp.discover,4200);
}

const bubble=document.getElementById('speech-bubble');
let idleTimer=null,hoverActive=false;
const BUBBLE_MAX_PX=17.6,BUBBLE_MIN_PX=10,BUBBLE_LINE_HEIGHT=1.45,BUBBLE_MAX_LINES=3;
function fitBubbleText(){
  let size=BUBBLE_MAX_PX;
  bubble.style.fontSize=size+'px';
  while(bubble.scrollHeight>size*BUBBLE_LINE_HEIGHT*BUBBLE_MAX_LINES+2 && size>BUBBLE_MIN_PX){
    size=Math.max(BUBBLE_MIN_PX,size-0.5);
    bubble.style.fontSize=size+'px';
  }
}
function say(text,holdMs){
  bubble.textContent=text;bubble.classList.add('show');fitBubbleText();
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{if(!hoverActive){bubble.classList.remove('show');scheduleIdle(true);}},holdMs||6000);
}
function sayHover(wp){hoverActive=true;clearTimeout(idleTimer);bubble.textContent=wp.hover;bubble.classList.add('show');fitBubbleText();}
let bubbleResizeTimer=null;
function scheduleBubbleFit(){
  clearTimeout(bubbleResizeTimer);
  bubbleResizeTimer=setTimeout(fitBubbleText,120);
}
window.addEventListener('resize',scheduleBubbleFit);
new ResizeObserver(scheduleBubbleFit).observe(mascotGuide);
function scheduleIdle(immediate){
  if(hoverActive)return;
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    if(hoverActive)return;
    say(IDLE_LINES[Math.floor(Math.random()*IDLE_LINES.length)],5500);
  },immediate?3000:800);
}
document.getElementById('mascot-img').addEventListener('click',()=>{hoverActive=false;say(IDLE_LINES[Math.floor(Math.random()*IDLE_LINES.length)],5000);});

const tooltip=document.getElementById('waypoint-tooltip');
const tipTitleEl=document.getElementById('tip-title');
const tipIntroEl=document.getElementById('tip-intro');
const tipJoinEl=document.getElementById('tip-join');
function showTooltip(wp){
  tipTitleEl.textContent=wp.title;
  tipIntroEl.textContent=wp.intro;
  tipJoinEl.textContent=wp.linkLabel;
  tipJoinEl.href=wp.link;
  tipJoinEl.onclick=()=>discover(wp);
  tooltip.classList.add('show');
}

const secretEl=document.getElementById('secret-chilli');
secretEl.addEventListener('click',e=>{
  if(localStorage.getItem(SECRET_KEY)!==TODAY_KEY){
    try{localStorage.setItem(SECRET_KEY,TODAY_KEY);}catch(err){}
    secretEl.classList.add('found');updateProgressPill();burstSparkles(e);hoverActive=false;say(SECRET_LINES[0],6000);
  }else{burstSparkles(e);hoverActive=false;say("You already claimed today's chilli, champion 🌶️🏆 Come back tomorrow for a new spot!",4500);}
});
function burstSparkles(e){
  const rect=mapWrapper.getBoundingClientRect(),scale=baseScale*zoom;
  const x=(e.clientX-rect.left)/scale,y=(e.clientY-rect.top)/scale;
  const symbols=['✨','🌟','💥','🎉'];
  for(let i=0;i<6;i++){
    const s=document.createElement('span');
    s.className='sparkle-burst';s.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    s.style.left=(x+(Math.random()*60-30))+'px';s.style.top=(y+(Math.random()*20-10))+'px';
    mapWrapper.appendChild(s);
    setTimeout(()=>s.remove(),950);
  }
}

applySavedState();
setTimeout(()=>say(IDLE_LINES[0],6000),900);
scheduleIdle(true);
</script>
