<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot Chilli Rapid Championship — Pairings</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 0;
  margin: 0 !important;
  padding: 0 !important;
  background: #1a1a1a;
}

body {
  display: block !important;
  position: relative;
  top: 0 !important;
  font-family: 'Nunito', sans-serif;
}

:root {
  --cream: #F2FAEF;
  --cream-deep: #E2F3DA;
  --paper: #FFFFFF;
  --ink: #1A1A1A;
  --ink-soft: #5A4440;
  --ink-faint: #C9B9B5;

  --red: #FF4433;
  --red-mid: #E0301F;
  --red-deep: #B3230F;

  --orange: #81B64C;
  --peach: #D3EDC4;
  --line: #D8EED0;

  --good: #34C759;
  --good-deep: #1B8A3A;
  --gold: #FFB020;
  --silver: #B8C0CC;
  --bronze: #D98A4B;

  --blue: #1D4ED8;
  --grey-band: #9AA3AF;

  --spring: cubic-bezier(.34,1.56,.64,1);
  --ease: cubic-bezier(.22,.61,.36,1);
}

.sb {
  font-family: 'Nunito', sans-serif;
  width: 100%;
  max-width: 700px;
  margin: 0 auto !important;
  padding: 0 !important;

  background: var(--cream);
  border-radius: 32px;

  box-shadow:
    0 1px 0 rgba(255,255,255,.6) inset,
    0 20px 50px -18px rgba(40,90,20,.35);

  overflow: visible;
  isolation: isolate;
}

.sb-top {
  background:
    radial-gradient(
      120% 160% at 15% -30%,
      rgba(224,68,51,.28),
      transparent 55%
    ),
    linear-gradient(
      135deg,
      #232323 0%,
      #151515 50%,
      #0a0a0a 100%
    );

  border-radius: 32px 32px 0 0;
  padding: 16px 18px 34px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.sb-top::before {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 28px;
  background: var(--cream);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  transform: scaleX(1.3);
}

/* ============================= */
/* RAPID HEADER */
/* ============================= */

.rapid-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  position: relative;
  z-index: 1;

  margin-bottom: 6px;

  perspective: 400px;

 
  width: 100%;
}

.rapid-brand .event-title {
  font-family: 'Fredoka', sans-serif !important;

  
  font-size: 24px !important;

  font-weight: 600 !important;

  color: #fff !important;

  line-height: 1.05 !important;

  text-shadow:
    0 3px 0 rgba(0,0,0,.35);

  position: relative;
  z-index: 1;

 
  display: block !important;

  white-space: nowrap !important;

  width: auto !important;
  max-width: none !important;

  flex: 0 1 auto !important;
}

.rapid-brand span {
  line-height: 1;
}

.rapid-brand .spin-y-icon {
  flex-shrink: 0;
}

.rapid-brand > svg.spin-y-icon {
  width: 38px !important;
  height: 38px !important;
}

.pepper-emoji {
  font-size: 24px;
  line-height: 1;
  flex-shrink: 0;
}

@keyframes spinY {
  from {
    transform: rotateY(0deg);
  }

  to {
    transform: rotateY(360deg);
  }
}

.spin-y-icon {
  display: inline-block;
  transform-style: preserve-3d;
  backface-visibility: visible;
  animation: spinY 3.2s linear infinite;
}

/* Subtitle */

.event-sub {
  display: inline-flex;
  align-items: center;
  gap: 6px;

  font-size: 11px;
  font-weight: 800;

  color: #fff;

  letter-spacing: .6px;
  text-transform: uppercase;

  margin-top: 10px;

  position: relative;
  z-index: 1;

  background: rgba(255,255,255,.22);

  padding: 5px 12px;

  border-radius: 999px;

  backdrop-filter: blur(4px);

  border: 1px solid rgba(255,255,255,.3);
}

.event-sub .rapid-mini-icon {
  width: 12px;
  height: 12px;
  fill: #81B64C;
  flex-shrink: 0;
  display: block;
}

/* ============================= */
/* MAIN */
/* ============================= */

.inner {
  width: 100%;
  margin: 0 auto;
  padding: 0 16px 20px;
}

.round-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  margin: 0 0 16px;

  z-index: 20;
  position: relative;

  flex-wrap: wrap;
  row-gap: 10px;
}

.round-stats {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  row-gap: 6px;
}

.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;

  font-size: 10px;
  font-weight: 800;

  color: var(--ink-soft);

  background: rgba(255,255,255,.65);

  backdrop-filter: blur(10px) saturate(1.3);

  padding: 6px 11px;

  border-radius: 999px;

  white-space: nowrap;

  flex-shrink: 0;

  box-shadow:
    0 0 0 1px rgba(210,235,195,.7) inset,
    0 4px 10px -6px rgba(40,90,20,.25);
}

.stat-pill .stat-num {
  color: var(--red-mid);
  font-weight: 900;
}

/* ============================= */
/* ROUND DROPDOWN */
/* ============================= */

.round-dropdown {
  position: relative;
  z-index: 30;
  margin-left: auto;
}

.round-dropdown-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  width: auto;
  min-width: 150px;

  padding: 11px 16px;

  border-radius: 18px;

  border: none;

  cursor: pointer;

  background: rgba(255,255,255,.75);

  backdrop-filter: blur(14px) saturate(1.4);

  box-shadow:
    0 10px 26px -10px rgba(40,90,20,.35),
    0 0 0 1px rgba(210,235,195,.7) inset;

  font-family: 'Fredoka', sans-serif;

  font-weight: 600;

  font-size: 14px;

  color: var(--red-mid);

  transition:
    background .18s var(--ease);
}

.round-dropdown-btn:hover {
  background: #EAF5E2;
}

.round-dropdown-btn .chev {
  width: 11px;
  height: 11px;

  fill: var(--red-mid);

  transition:
    transform .22s var(--spring);

  flex-shrink: 0;
}

.round-dropdown.open .round-dropdown-btn .chev {
  transform: rotate(180deg);
}

.round-dropdown-list {
  position: absolute;

  top: calc(100% + 8px);
  right: 0;

  width: max-content;
  min-width: 100%;
  max-width: 240px;

  background: var(--paper);

  border-radius: 18px;

  overflow: hidden;

  box-shadow:
    0 16px 36px -10px rgba(60,120,40,.4),
    0 0 0 1px var(--peach);

  max-height: 280px;

  overflow-y: auto;

  opacity: 0;

  transform:
    translateY(-6px)
    scale(.98);

  pointer-events: none;

  transition:
    opacity .16s var(--ease),
    transform .16s var(--ease);
}

.round-dropdown.open .round-dropdown-list {
  opacity: 1;

  transform:
    translateY(0)
    scale(1);

  pointer-events: auto;
}

.round-dropdown-item {
  padding: 12px 18px;

  font-size: 9px;
  font-weight: 800;

  color: var(--ink);

  cursor: pointer;

  border-top: 1px solid var(--cream-deep);
}

.round-dropdown-item:first-child {
  border-top: none;
}

.round-dropdown-item:hover {
  background: #EAF5E2;
}

.round-dropdown-item.active {
  background:
    linear-gradient(
      135deg,
      #FF5B3D,
      var(--red-mid)
    );

  color: #fff;
}

/* ============================= */
/* GROUP SCROLL */
/* ============================= */

.groups-scroll {
  width: 100%;

  max-height: 450px;

  padding-top: 2px;

  overflow-y: auto;
  overflow-x: hidden;

  padding-right: 4px;

  -webkit-overflow-scrolling: touch;

  scrollbar-width: thin;

  scrollbar-color:
    var(--peach)
    transparent;
}

.groups-scroll::-webkit-scrollbar {
  width: 7px;
}

.groups-scroll::-webkit-scrollbar-track {
  background: transparent;
}

.groups-scroll::-webkit-scrollbar-thumb {
  background: var(--peach);
  border-radius: 999px;
}

.groups-scroll::-webkit-scrollbar-thumb:hover {
  background: var(--orange);
}

/* ============================= */
/* FINAL */
/* ============================= */

#content.final-centered {
  min-height: 450px;

  display: flex;

  flex-direction: column;

  justify-content: center;
}

.champion-title-plain {
  text-align: center;

  font-family: 'Fredoka', sans-serif;

  font-weight: 600;

  font-size: 15px;

  line-height: 1.4;

  color: var(--red-mid);

  margin-bottom: 12px;
}

.champion-stats-plain {
  text-align: center;

  font-size: 11px;

  font-weight: 800;

  color: var(--ink-soft);

  line-height: 1.7;

  margin-top: 12px;
}

.champion-stats-plain .stat-sep {
  color: var(--ink-faint);
  margin: 0 8px;
}

.champion-stats-plain .stat-hl {
  color: var(--red-mid);
  font-weight: 900;
}

/* ============================= */
/* GROUP CARD */
/* ============================= */

.group-card {
  background: var(--paper);

  border-radius: 24px;

  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 8px 22px -10px rgba(60,120,40,.32);

  padding: 6px;

  margin-bottom: 16px;

  overflow: visible;
}

.group-card:last-child {
  margin-bottom: 4px;
}

.table-scroll {
  overflow-x: auto;
  overflow-y: visible;

  border-radius: 18px;

  -webkit-overflow-scrolling: touch;
}

.table-scroll::-webkit-scrollbar {
  height: 6px;
}

.table-scroll::-webkit-scrollbar-thumb {
  background: var(--peach);
  border-radius: 3px;
}

.table-scroll::-webkit-scrollbar-track {
  background: transparent;
}

table.pairings {
  width: 100%;

  border-collapse: separate;

  border-spacing: 0;

  table-layout: fixed;
}

table.pairings thead th {
  background:
    linear-gradient(
      135deg,
      #1a1a1a,
      #0a0a0a
    );

  color: #fff;

  font-family: 'Fredoka', sans-serif;

  font-weight: 600;

  font-size: 12.5px;

  padding: 11px 5px;

  text-align: center;

  white-space: nowrap;
}

table.pairings thead th:first-child {
  text-align: left;

  padding-left: 18px;

  border-radius: 16px 0 0 0;

  width: 200px;

  min-width: 200px;

  max-width: 200px;
}

table.pairings thead th:last-child {
  border-radius: 0 16px 0 0;
}

table.pairings th:not(:first-child):not(:nth-last-child(-n+2)),
table.pairings td:not(:first-child):not(:nth-last-child(-n+2)) {
  width: 42px;
}

table.pairings th:nth-last-child(-n+2),
table.pairings td:nth-last-child(-n+2) {
  width: 52px;
}

.th-group-label {
  display: flex;
  align-items: center;
  gap: 7px;

  font-size: 13px;
}

.th-dot {
  width: 8px;
  height: 8px;

  border-radius: 50%;

  flex-shrink: 0;

  background:
    linear-gradient(
      135deg,
      var(--red),
      var(--orange)
    );
}

table.pairings tbody tr {
  background: var(--paper);
  position: relative;
}

table.pairings tbody tr:nth-child(odd) {
  background: #FFFAF7;
}

table.pairings tbody tr:hover {
  background: #EAF5E2;
}

table.pairings tbody tr.band-through {
  box-shadow:
    inset 4px 0 0 var(--blue);
}

table.pairings tbody tr.band-out {
  box-shadow:
    inset 4px 0 0 var(--red-deep);
}

table.pairings tbody td {
  padding: 9px 4px;

  text-align: center;

  font-size: 12px;

  font-weight: 800;

  color: var(--ink);

  border-top: none;

  white-space: nowrap;
}

table.pairings tbody td:first-child {
  text-align: left;

  padding-left: 14px;

  width: 200px;

  min-width: 200px;

  max-width: 200px;
}

/* ============================= */
/* PLAYERS */
/* ============================= */

.player-cell {
  display: flex;

  align-items: center;

  gap: 9px;

  min-width: 0;
}

.player-rank {
  width: 22px;
  height: 22px;

  border-radius: 50%;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  font-family: 'Fredoka', sans-serif;

  font-weight: 600;

  font-size: 11px;

  color: #fff;

  background:
    linear-gradient(
      135deg,
      var(--peach),
      var(--orange)
    );
}

table.final-round .player-rank.r1 {
  background:
    linear-gradient(
      135deg,
      var(--gold),
      #E0301F
    );

  box-shadow:
    0 2px 8px -2px rgba(255,176,32,.6);
}

table.final-round .player-rank.r2 {
  background:
    linear-gradient(
      135deg,
      var(--silver),
      #8E97A8
    );
}

table.final-round .player-rank.r3 {
  background:
    linear-gradient(
      135deg,
      var(--bronze),
      #96591F
    );
}

.player-avatar-link {
  display: inline-flex;

  flex-shrink: 0;

  border-radius: 11px;
}

.player-avatar {
  width: 32px;
  height: 36px;

  border-radius: 9px;

  border: 2px solid #fff;

  box-shadow:
    0 0 0 1.5px var(--peach);

  object-fit: cover;

  background: #E2F0D8;

  display: block;
}

.player-name {
  font-size: 12px;

  font-weight: 800;

  color: var(--red-mid);

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  flex: 1;

  min-width: 0;
}

.player-name a {
  color: inherit;

  text-decoration: none;
}

.player-name a:hover {
  text-decoration: underline;
}

.withdraw-icon {
  color: var(--red-deep);

  margin-left: 4px;

  vertical-align: middle;

  flex-shrink: 0;
}

/* ============================= */
/* CELLS */
/* ============================= */

.cell-x {
  color: var(--ink-faint);

  font-size: 16px;

  font-weight: 900;
}

.cell-board {
  display: inline-flex;

  align-items: center;

  justify-content: center;

  outline: none;

  cursor: pointer;
}

.cell-board svg {
  fill: #9AA3AF;

  width: 19px;
  height: 19px;

  opacity: .9;
}

.badge {
  display: inline-flex;

  align-items: center;

  justify-content: center;

  font-size: 16px;

  font-weight: 900;

  font-family: 'Nunito', sans-serif;

  cursor: pointer;

  text-decoration: none;

  outline: none;
}

.badge.win {
  color: var(--blue);
}

.badge.draw {
  color: var(--ink-soft);
}

.badge.loss {
  color: var(--red-deep);
}

.standing-val {
  display: inline-flex;

  align-items: center;

  gap: 4px;

  font-family: 'Fredoka', sans-serif;

  font-weight: 600;

  font-size: 16px;

  color: var(--red-mid);
}

.tiebreak-val {
  font-family: 'Fredoka', sans-serif;

  font-size: 16px;

  font-weight: 600;

  color: var(--ink-soft);
}

/* ============================= */
/* LEGEND */
/* ============================= */

.legend-card {
  background: var(--paper);

  border-radius: 18px;

  padding: 13px 14px;

  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 5px 14px -6px rgba(60,120,40,.25);

  display: flex;

  flex-wrap: wrap;

  gap: 10px 16px;

  margin-top: 14px;

  margin-bottom: 14px;
}

.legend-item {
  display: flex;

  align-items: center;

  gap: 6px;

  font-size: 10.5px;

  font-weight: 800;

  color: var(--ink-soft);
}

.legend-swatch {
  width: 16px;
  height: 16px;

  border-radius: 6px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 9px;
}

.legend-swatch.win {
  color: var(--blue);
}

.legend-swatch.draw {
  color: var(--ink-soft);
}

.legend-swatch.loss {
  color: var(--red-deep);
}

.legend-swatch.pending svg {
  fill: #9AA3AF;

  width: 14px;
  height: 14px;
}

.legend-swatch.through,
.legend-swatch.eliminated {
  width: 7px;
  height: 18px;

  border-radius: 3px;
}

.legend-swatch.through {
  background: var(--blue);
}

.legend-swatch.eliminated {
  background: var(--red-deep);
}

/* ============================= */
/* PODIUM */
/* ============================= */

.podium-wrap {
  margin: 0 0 14px;

  padding: 10px 8px 12px;

  border-radius: 18px;

  background: rgba(255,255,255,.7);

  box-shadow:
    0 6px 18px -14px rgba(60,120,40,.3);
}

.podium-layout {
  display: flex;

  align-items: flex-end;

  gap: 12px;
}

.podium-row {
  flex: 1;

  display: flex;

  align-items: flex-end;

  justify-content: center;

  gap: 10px;

  padding: 0 3px;
}

.podium-block {
  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 4px;

  width: 85px;
}

.podium-medal {
  font-size: 24px;

  line-height: 1;
}

.podium-avatar {
  width: 55px;
  height: 55px;

  border-radius: 9px;

  border: 2px solid #fff;

  box-shadow:
    0 0 0 1.5px var(--peach);

  object-fit: cover;

  background: #E2F0D8;

  display: block;
}

.podium-name {
  font-size: 13px;

  font-weight: 800;

  color: var(--ink);

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  max-width: 85px;
}

.podium-step {
  width: 100%;

  border-radius: 9px 9px 0 0;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 4px 3px 5px;

  font-family: 'Fredoka', sans-serif;
}

.podium-place {
  font-size: 17px;

  font-weight: 800;

  color: rgba(255,255,255,.9);
}

.podium-block.p1 .podium-step {
  height: 53px;

  background:
    linear-gradient(
      135deg,
      var(--gold),
      #E0301F
    );
}

.podium-block.p2 .podium-step {
  height: 37px;

  background:
    linear-gradient(
      135deg,
      var(--silver),
      #8E97A8
    );
}

.podium-block.p3 .podium-step {
  height: 27px;

  background:
    linear-gradient(
      135deg,
      var(--bronze),
      #96591F
    );
}

/* ============================= */
/* FOOTER / LOADING */
/* ============================= */

.footer {
  text-align: center;

  margin-top: 6px;

  font-size: 11px;

  font-weight: 800;

  color: var(--ink-faint);
}

.load-msg {
  text-align: center;

  padding: 30px 14px;

  font-size: 13px;

  font-weight: 800;

  color: var(--ink-soft);
}

.error-msg {
  text-align: center;

  padding: 20px 14px;

  font-size: 12px;

  font-weight: 800;

  color: var(--red-deep);

  background: #FFF1EE;

  border-radius: 14px;

  margin-bottom: 14px;
}

.table-empty {
  padding: 26px 14px;

  text-align: center;

  font-size: 12px;

  font-weight: 800;

  color: var(--ink-faint);
}

/* ============================= */
/* SKELETON */
/* ============================= */

.skel {
  display: inline-block;

  border-radius: 6px;

  background:
    linear-gradient(
      90deg,
      #E1EFD8 25%,
      #F1F8EA 37%,
      #E1EFD8 63%
    );

  background-size: 400% 100%;

  animation:
    skel-shimmer 1.4s ease infinite;
}

@keyframes skel-shimmer {
  0% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0 50%;
  }
}

.skel-avatar {
  width: 32px;
  height: 32px;

  border-radius: 9px;

  flex-shrink: 0;
}

.skel-rank {
  width: 22px;
  height: 22px;

  border-radius: 50%;

  flex-shrink: 0;
}

.skel-name {
  width: 100px;
  height: 11px;

  border-radius: 5px;
}

.skel-cell {
  width: 19px;
  height: 19px;

  border-radius: 6px;
}

.skel-standing {
  width: 22px;
  height: 15px;

  border-radius: 5px;
}

.skel-tiebreak {
  width: 18px;
  height: 12px;

  border-radius: 5px;
}

/* ============================= */
/* POPOVER */
/* ============================= */

#matchPopover {
  position: fixed;

  z-index: 9999;

  pointer-events: none;

  width: 220px;

  background: var(--paper);

  border-radius: 18px;

  padding: 14px;

  box-shadow:
    0 18px 40px -12px rgba(0,0,0,.35),
    0 0 0 1px var(--peach);

  opacity: 0;

  transform:
    translateY(6px)
    scale(.97);

  transition:
    opacity .14s var(--ease),
    transform .14s var(--ease);

  font-family: 'Nunito', sans-serif;
}

  opacity: 1;

    translateY(0)
    scale(1);

}

  font-size: 9px;

<script>

const DATA_URL =
  'https://raw.githubusercontent.com/taki2023/taki/refs/heads/main/rapid2026.json';

const DEFAULT_AVATAR =
  'https://www.chess.com/bundles/web/images/user-image.007dad08.svg';

const ADVANCING_PLAYERS_PER_GROUP = 2;

const BOARD_SVG =
  '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.33 22H4.65999C2.65999 22 1.98999 21.33 1.98999 19.33V4.65999C1.98999 2.65999 2.65999 1.98999 4.65999 1.98999H19.33C21.33 1.98999 22 2.65999 22 4.65999V19.33C22 21.33 21.33 22 19.33 22ZM3.99999 20H7.99999V16H3.99999V20ZM12 20H16V16H12V20ZM7.99999 16H12V12H7.99999V16ZM3.99999 12H7.99999V7.99999H3.99999V12ZM16 16H20V12H16V16ZM12 12H16V7.99999H12V12ZM7.99999 7.99999H12V3.99999H7.99999V7.99999ZM16 7.99999H20V3.99999H16V7.99999Z"></path></svg>';

const WITHDRAW_SVG =
  '<svg class="withdraw-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M4.89993 16.4L0.269932 12.43C-0.100068 12.13 -0.100068 11.86 0.269932 11.56L4.89993 7.59C5.69993 6.92 5.99993 7.06 5.99993 8.09V15.89C5.99993 16.92 5.69993 17.06 4.89993 16.39V16.4ZM16.0699 10.5C16.8399 10.5 17.1399 10.73 17.1399 11.33L17.1699 12.66C17.1699 13.26 16.8699 13.49 16.0999 13.49H4.36993V10.49L16.0699 10.5ZM11.9999 2H19.9999C22.4699 2 23.9999 3.53 23.9999 6V18C23.9999 20.47 22.4699 22 19.9999 22H11.9999C9.52993 22 7.99993 20.47 7.99993 18V16.9C7.99993 16.3 8.32993 15.97 8.92993 15.97H9.05993C9.65993 15.97 9.98993 16.3 9.98993 16.9V17.6C9.98993 19.6 10.3899 20 12.3899 20H19.5899C21.5899 20 21.9899 19.6 21.9899 17.6V6.4C21.9899 4.4 21.5899 4 19.5899 4H12.3899C10.3899 4 9.98993 4.4 9.98993 6.4V7.03C9.98993 7.63 9.65993 7.96 9.05993 7.96H8.92993C8.32993 7.96 7.99993 7.63 7.99993 7.03V6C7.99993 3.53 9.52993 2 11.9999 2Z"></path></svg>';

let TOURNAMENT = {
  rounds: [],
  playerInfo: {},
  stats: null
};

let WITHDRAWN_SET = new Set();

let activeRoundIdx = 0;
let hasLoadedOnce = false;

const popover =
  document.getElementById('matchPopover');

let pinnedCellEl = null;

let lastMouseX = 0;
let lastMouseY = 0;

function esc(v) {
  return String(v == null ? '' : v)
    .replace(
      /[&<>'"]/g,
      c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[c])
    );
}

function prettifyUsername(u) {
  return (u || '')
    .replace(/-/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

function prettifyGroupName(n) {
  return (n || '')
    .replace(/\b\w/g, c => c.toUpperCase());
}

function isWithdrawn(u) {
  return WITHDRAWN_SET.has(
    (u || '').toLowerCase()
  );
}

function formatSum(p) {
  return (
    Math.round(
      Number(p || 0) * 2
    ) / 2
  ).toString();
}

function pointsClass(p) {
  return p === 1
    ? 'win'
    : p === 0
      ? 'loss'
      : 'draw';
}

function playerInfo(username) {
  return (
    TOURNAMENT.playerInfo &&
    TOURNAMENT.playerInfo[username]
  ) || {
    name: prettifyUsername(username),
    avatar: DEFAULT_AVATAR,
    username
  };
}

function isFinalRound(r) {
  return r &&
    r.groups &&
    r.groups.length === 1;
}

function displayRoundName(r) {
  return isFinalRound(r)
    ? 'Final Round'
    : (r.name || ('Round ' + r.number));
}

function matchStageLabel(m) {

  if (
    m.status === 'withdrawn' ||
    m.status === 'forfeit'
  ) {
    return {
      cls: 'forfeit',
      text: 'Withdrew'
    };
  }

  if (m.playedCount === 0) {
    return {
      cls: 'pending',
      text: 'Not started'
    };
  }

  if (m.playedCount === 1) {
    return {
      cls: 'partial',
      text: 'In progress'
    };
  }

  return {
    cls: 'finished',
    text: 'Finished'
  };
}

function scoreCompareClasses(a, b) {

  if (
    a == null ||
    b == null ||
    isNaN(a) ||
    isNaN(b)
  ) {
    return {
      a: 'tie',
      b: 'tie'
    };
  }

  if (a > b) {
    return {
      a: 'win',
      b: 'lose'
    };
  }

  if (a < b) {
    return {
      a: 'lose',
      b: 'win'
    };
  }

  return {
    a: 'tie',
    b: 'tie'
  };
}

function gameBtn(
  g,
  label,
  playerA,
  playerB
) {

  if (!g) {
    return '<span class="mp-watch disabled">' +
      label +
      '</span>';
  }

  if (g.dueToWithdrawal) {
    return '<span class="mp-watch forfeit">' +
      esc(
        isWithdrawn(playerA)
          ? playerInfo(playerA).name
          : playerInfo(playerB).name
      ) +
      ' withdrew</span>';
  }

  if (!g.link) {
    return '<span class="mp-watch forfeit">Forfeit</span>';
  }

  return '<a class="mp-watch" href="' +
    esc(g.link) +
    '" target="_blank" rel="noopener noreferrer">' +
    label +
    '</a>';
}

function popoverHTML(a, b, m) {

  const pa = playerInfo(a);
  const pb = playerInfo(b);

  const games = m.games || [];

  const stage = matchStageLabel(m);

  const totalA = Number(m.scoreA || 0);
  const totalB = Number(m.scoreB || 0);

  const cls =
    scoreCompareClasses(
      totalA,
      totalB
    );

  const teams =
    '<div class="mp-teams-row">' +

      '<div class="mp-team">' +

        '<img src="' +
        esc(pa.avatar) +
        '" onerror="this.src=\'' +
        DEFAULT_AVATAR +
        '\'">' +

        '<div class="mp-team-name">' +
        esc(pa.name) +
        '</div>' +

      '</div>' +

      '<div class="mp-vs">vs</div>' +

      '<div class="mp-team">' +

        '<img src="' +
        esc(pb.avatar) +
        '" onerror="this.src=\'' +
        DEFAULT_AVATAR +
        '\'">' +

        '<div class="mp-team-name">' +
        esc(pb.name) +
        '</div>' +

      '</div>' +

    '</div>';

  if (m.bothWithdrawn) {

    return (
      '<div class="mp-status forfeit">Withdrew</div>' +
      teams +
      '<div class="mp-score-row">' +
        '<span class="mp-score-num tie">0</span>' +
        '<span class="mp-score-sep">–</span>' +
        '<span class="mp-score-num tie">0</span>' +
      '</div>' +
      '<div class="mp-forfeit-note">' +
        'Both players withdrew from the tournament' +
      '</div>'
    );
  }

  const scoreA =
    m.playedCount
      ? formatSum(totalA)
      : '–';

  const scoreB =
    m.playedCount
      ? formatSum(totalB)
      : '–';

  const gamesRow =
    m.status === 'forfeit'
      ? '<div class="mp-forfeit-note">Forfeit result</div>'
      : '<div class="mp-games-row">' +
          gameBtn(
            games[0],
            'Game 1',
            a,
            b
          ) +
          gameBtn(
            games[1],
            'Game 2',
            a,
            b
          ) +
        '</div>';

  return (
    '<div class="mp-status ' +
      stage.cls +
    '">' +
      stage.text +
    '</div>' +

    teams +

    '<div class="mp-score-row">' +

      '<span class="mp-score-num ' +
        (m.playedCount
          ? cls.a
          : 'tie') +
      '">' +
        scoreA +
      '</span>' +

      '<span class="mp-score-sep">–</span>' +

      '<span class="mp-score-num ' +
        (m.playedCount
          ? cls.b
          : 'tie') +
      '">' +
        scoreB +
      '</span>' +

    '</div>' +

    gamesRow
  );
}

function positionPopover(x, y) {

  const pad = 14;

  const rect =
    popover.getBoundingClientRect();

  let left =
    x -
    rect.width / 2;

  let top =
    y -
    rect.height -
    16;

  left =
    Math.max(
      pad,
      Math.min(
        left,
        window.innerWidth -
          rect.width -
          pad
      )
    );

  if (top < pad) {
    top = y + 20;
  }

  popover.style.left =
    left + 'px';

  popover.style.top =
    top + 'px';
}

function showPopover(x, y, html) {

  popover.innerHTML = html;

  popover.classList.add('show');

  positionPopover(x, y);
}

function hidePopover() {
  popover.classList.remove('show');
}

document.addEventListener(
  'click',
  e => {

    if (!pinnedCellEl) return;

    if (
      popover.contains(e.target) ||
      e.target.closest('[data-a][data-b]')
    ) {
      return;
    }

    hidePopover();

    pinnedCellEl = null;
  }
);

popover.addEventListener(
  'mouseleave',
  () => {

    hidePopover();

    pinnedCellEl = null;
  }
);

function renderRoundNav() {

  const wrap =
    document.getElementById(
      'roundDropdown'
    );

  const list =
    document.getElementById(
      'roundDropdownList'
    );

  const label =
    document.getElementById(
      'roundDropdownLabel'
    );

  if (!TOURNAMENT.rounds.length) {

    wrap.style.display =
      'none';

    return;
  }

  wrap.style.display =
    'block';

  label.textContent =
    displayRoundName(
      TOURNAMENT.rounds[
        activeRoundIdx
      ]
    );

  list.innerHTML =
    TOURNAMENT.rounds
      .map(
        (r, i) =>
          '<div class="round-dropdown-item ' +
          (i === activeRoundIdx
            ? 'active'
            : '') +
          '" data-idx="' +
          i +
          '">' +
          esc(
            displayRoundName(r)
          ) +
          '</div>'
      )
      .join('');

  list
    .querySelectorAll(
      '.round-dropdown-item'
    )
    .forEach(
      el =>
        el.addEventListener(
          'click',
          () => {

            activeRoundIdx =
              Number(
                el.dataset.idx
              );

            wrap.classList.remove(
              'open'
            );

            renderRoundNav();

            renderActiveRound();
          }
        )
    );
}

(function () {

  const wrap =
    document.getElementById(
      'roundDropdown'
    );

  const btn =
    document.getElementById(
      'roundDropdownBtn'
    );

  btn.addEventListener(
    'click',
    e => {

      e.stopPropagation();

      wrap.classList.toggle(
        'open'
      );
    }
  );

  document.addEventListener(
    'click',
    e => {

      if (!wrap.contains(e.target)) {
        wrap.classList.remove(
          'open'
        );
      }
    }
  );

})();

function renderRoundStats(round) {

  document.getElementById(
    'roundStats'
  ).style.display =
    'flex';

  const groups =
    (round && round.groups) ||
    [];

  const matches =
    groups.flatMap(
      g =>
        Array.isArray(g.matches)
          ? g.matches
          : []
    );

  const matchesTotal =
    matches.length;

  const matchesFinished =
    matches.filter(
      m => {

        if (
          m.status === 'withdrawn' ||
          m.status === 'forfeit'
        ) {
          return true;
        }

        return Number(
          m.playedCount || 0
        ) >= 2;
      }
    ).length;

  const gamesTotal =
    matches.reduce(
      (n, m) => {

        const games =
          Array.isArray(m.games)
            ? m.games
            : [];

        return n +
          (games.length || 2);
      },
      0
    );

  const gamesFinished =
    matches.reduce(
      (n, m) => {

        if (
          m.status === 'withdrawn' ||
          m.status === 'forfeit'
        ) {
          return n + 2;
        }

        const games =
          Array.isArray(m.games)
            ? m.games
            : [];

        const explicit =
          games.filter(
            g =>
              g &&
              (
                g.result != null ||
                g.score != null ||
                g.status === 'finished' ||
                g.finished === true ||
                g.link != null
              )
          ).length;

        return n +
          Math.min(
            2,
            Math.max(
              Number(
                m.playedCount || 0
              ),
              explicit
            )
          );
      },
      0
    );

  document.getElementById(
    'statMatches'
  ).innerHTML =
    '<span class="stat-num">' +
    matchesFinished +
    '</span> / <span class="stat-num">' +
    matchesTotal +
    '</span> matchups';

  document.getElementById(
    'statGames'
  ).innerHTML =
    '<span class="stat-num">' +
    gamesFinished +
    '</span> / <span class="stat-num">' +
    gamesTotal +
    '</span> games';
}

function championTitleHTML(
  champion
) {

  return champion

    ? '<div class="champion-title-plain" id="championTitle">' +
      '🏆 Congrats to <span class="stat-hl">@' +
      esc(champion) +
      '</span> — our first ever Hot Chilli Rapid Champion! 🌶️' +
      '</div>'

    : '<div class="champion-title-plain" id="championTitle">' +
      '🌶️ Who will be crowned our first ever Rapid Champion? 🏆' +
      '</div>';
}

function championStatsHTML(stats) {

  const s = stats || {};

  const wins =
    s.mostWinsPlayer
      ? (
          s.mostWinsCount +
          ' — @' +
          esc(
            s.mostWinsPlayer
          )
        )
      : '–';

  const upset =
    s.biggestUpset
      ? (
          s.biggestUpset.winnerRating +
          ' beat ' +
          s.biggestUpset.loserRating +
          ' (@' +
          esc(
            s.biggestUpset.winner
          ) +
          ' over @' +
          esc(
            s.biggestUpset.loser
          ) +
          ')'
        )
      : '–';

  return (
    '<div class="champion-stats-plain">' +

      '<span>' +
        'Matches played: ' +
        '<span class="stat-hl">' +
          (s.matchesPlayedCount || 0) +
        '</span>' +
      '</span>' +

      '<span class="stat-sep">•</span>' +

      '<span>' +
        'Most wins: ' +
        '<span class="stat-hl">' +
          wins +
        '</span>' +
      '</span>' +

      '<span class="stat-sep">•</span>' +

      '<span>' +
        'Biggest upset: ' +
        '<span class="stat-hl">' +
          upset +
        '</span>' +
      '</span>' +

    '</div>'
  );
}

  place
) {

      p.username
    );

  const medal =
    place === 1
      ? '🥇'
      : place === 2
        ? '🥈'
        : '🥉';

  return (
    '<div class="podium-block p' +
      place +
    '">' +

      '<div class="podium-medal">' +
        medal +
      '</div>' +

      '<a href="https://www.chess.com/member/' +
        encodeURIComponent(
          p.username
        ) +
        '" target="_blank" rel="noopener noreferrer">' +

        '<img class="podium-avatar" src="' +
          esc(info.avatar) +
          '" onerror="this.src=\'' +
          DEFAULT_AVATAR +
          '\'">' +

      '</a>' +

      '<div class="podium-name">@' +
        esc(p.username) +
      '</div>' +

      '<div class="podium-step">' +
        '<span class="podium-place">' +
          p.score +
        '</span>' +
      '</div>' +

function podiumHTML(podium) {

  return (
    '<div class="podium-layout">' +

      '<div class="podium-row">' +

        (
          podium[1]
            ? podiumBlockHTML(
                podium[1],
                2
              )
            : ''
        ) +

        (
          podium[0]
            ? podiumBlockHTML(
                podium[0],
                1
              )
            : ''
        ) +

        (
          podium[2]
            ? podiumBlockHTML(
                podium[2],
                3
              )
            : ''
        ) +

      '</div>' +

    '</div>'
  );
}

function headerRowHTML(
  n,
  name
) {

  let h =
    '<tr>' +
      '<th>' +
        '<div class="th-group-label">' +
          '<span class="th-dot"></span>' +
          esc(name) +
        '</div>' +
      '</th>';

  for (
    let i = 0;
    i < n;
    i++
  ) {
    h +=
      '<th>' +
      (i + 1) +
      '</th>';
  }

  return (
    h +
    '<th>Pts</th>' +
    '<th>TB</th>' +
    '</tr>'
  );
}

function groupHTML(
  group,
  gi,
  isFinal
) {

  const standings =
    group.standings ||
    group.players.map(
      (username, i) => ({
        username,
        rank: i + 1,
        score: 0,
        tiebreak: 0,
        qualified: false
      })
    );

  const order =
    standings
      .slice()
      .sort(
        (a, b) =>
          a.rank - b.rank
      );

  let body = '';

  order.forEach(
    (row, rank) => {

      const info =
        playerInfo(
          row.username
        );

      const rankClass =
        rank === 0
          ? 'r1'
          : rank === 1
            ? 'r2'
            : rank === 2
              ? 'r3'
              : '';

      const band =
        isFinal
          ? ''
          : (
              row.qualified
                ? 'band-through'
                : 'band-out'
            );

      body +=
        '<tr class="' +
        band +
        '">' +

          '<td>' +

            '<div class="player-cell">' +

              '<div class="player-rank ' +
                rankClass +
              '">' +
                (rank + 1) +
              '</div>' +

              '<a class="player-avatar-link" href="https://www.chess.com/member/' +
                encodeURIComponent(
                  row.username
                ) +
                '" target="_blank" rel="noopener noreferrer">' +

                '<img class="player-avatar" src="' +
                  esc(info.avatar) +
                  '" onerror="this.src=\'' +
                  DEFAULT_AVATAR +
                  '\'">' +

              '</a>' +

              '<div class="player-name">' +

                '<a href="https://www.chess.com/member/' +
                  encodeURIComponent(
                    row.username
                  ) +
                  '" target="_blank" rel="noopener noreferrer">' +

                  esc(info.name) +

                '</a>' +

              '</div>' +

              (
                isWithdrawn(
                  row.username
                )
                  ? WITHDRAW_SVG
                  : ''
              ) +

            '</div>' +

          '</td>';

      order.forEach(
        col => {

          if (
            col.username ===
            row.username
          ) {

            body +=
              '<td>' +
                '<span class="cell-x">✕</span>' +
              '</td>';

            return;
          }

          const m =
            group.matches.find(
              x =>
                (
                  x.playerA ===
                  row.username &&
                  x.playerB ===
                  col.username
                ) ||
                (
                  x.playerA ===
                  col.username &&
                  x.playerB ===
                  row.username
                )
            );

          if (!m) {

            body +=
              '<td>' +
                '<span class="cell-board">' +
                  BOARD_SVG +
                '</span>' +
              '</td>';

            return;
          }

          const flip =
            m.playerA !==
            row.username;

          const total =
            flip
              ? m.scoreB
              : m.scoreA;

          let inner;

          if (m.bothWithdrawn) {

            inner =
              '<span class="badge draw" data-a="' +
              esc(row.username) +
              '" data-b="' +
              esc(col.username) +
              '">' +
              '0' +
              '</span>';

          } else if (
            m.playedCount >= 2
          ) {

            inner =
              '<span class="badge ' +
              pointsClass(
                total === 2
                  ? 1
                  : total === 0
                    ? 0
                    : 0.5
              ) +
              '" data-a="' +
              esc(row.username) +
              '" data-b="' +
              esc(col.username) +
              '">' +
              formatSum(total) +
              '</span>';

          } else {

            inner =
              '<span class="cell-board" data-a="' +
              esc(row.username) +
              '" data-b="' +
              esc(col.username) +
              '">' +
              BOARD_SVG +
              '</span>';
          }

          body +=
            '<td>' +
              inner +
            '</td>';
        }
      );

      body +=
        '<td>' +
          '<span class="standing-val">' +
            formatSum(row.score) +
          '</span>' +
        '</td>' +

        '<td>' +
          '<span class="tiebreak-val">' +
            formatSum(row.tiebreak) +
          '</span>' +
        '</td>' +

        '</tr>';
    }
  );

  return (
    '<div class="group-card">' +

      '<div class="table-scroll">' +

        '<table class="pairings ' +
          (
            isFinal
              ? 'final-round'
              : ''
          ) +
        '">' +

          '<thead>' +

            headerRowHTML(
              order.length,
              group.name
            ) +

          '</thead>' +

          '<tbody>' +
            body +
          '</tbody>' +

        '</table>' +

      '</div>' +

    '</div>'
  );
}

function bindCells(round) {

  document
    .querySelectorAll(
      '[data-a][data-b]'
    )
    .forEach(
      el => {

        el.addEventListener(
          'mouseenter',
          e => {

            lastMouseX =
              e.clientX;

            lastMouseY =
              e.clientY;

            const a =
              el.dataset.a;

            const b =
              el.dataset.b;

            const g =
              round.groups.find(
                x =>
                  x.matches.some(
                    m =>
                      (
                        m.playerA === a &&
                        m.playerB === b
                      ) ||
                      (
                        m.playerA === b &&
                        m.playerB === a
                      )
                  )
              );

            const m =
              g &&
              g.matches.find(
                x =>
                  (
                    x.playerA === a &&
                    x.playerB === b
                  ) ||
                  (
                    x.playerA === b &&
                    x.playerB === a
                  )
              );

            if (m) {
              showPopover(
                e.clientX,
                e.clientY,
                popoverHTML(
                  a,
                  b,
                  m
                )
              );
            }
          }
        );

        el.addEventListener(
          'mousemove',
          e => {

            lastMouseX =
              e.clientX;

            lastMouseY =
              e.clientY;

            if (
              popover.classList.contains(
                'show'
              )
            ) {
              positionPopover(
                e.clientX,
                e.clientY
              );
            }
          }
        );

        el.addEventListener(
          'mouseleave',
          () => {

            hidePopover();

            pinnedCellEl = null;
          }
        );

        el.addEventListener(
          'click',
          e => {

            e.stopPropagation();

            const a =
              el.dataset.a;

            const b =
              el.dataset.b;

            const g =
              round.groups.find(
                x =>
                  x.matches.some(
                    m =>
                      (
                        m.playerA === a &&
                        m.playerB === b
                      ) ||
                      (
                        m.playerA === b &&
                        m.playerB === a
                      )
                  )
              );

            const m =
              g &&
              g.matches.find(
                x =>
                  (
                    x.playerA === a &&
                    x.playerB === b
                  ) ||
                  (
                    x.playerA === b &&
                    x.playerB === a
                  )
              );

            if (!m) return;

            showPopover(
              e.clientX,
              e.clientY,
              popoverHTML(
                a,
                b,
                m
              )
            );
          }
        );
      }
    );
}

function renderActiveRound() {

  const content =
    document.getElementById(
      'content'
    );

  const scroll =
    document.querySelector(
      '.groups-scroll'
    );

  const round =
    TOURNAMENT.rounds[
      activeRoundIdx
    ];

  if (scroll) {
    scroll.scrollTop = 0;
  }

  if (!round) {

    content.classList.remove(
      'final-centered'
    );

    content.innerHTML =
      '<div class="load-msg">' +
      'No round data found in the tournament data file.' +
      '</div>';

    document.getElementById(
      'roundStats'
    ).style.display =
      'none';

    return;
  }

  const final =
    isFinalRound(round);

  content.classList.toggle(
    'final-centered',
    final
  );

  let html =
    final
      ? championTitleHTML(
          TOURNAMENT.stats &&
          TOURNAMENT.stats.champion
        )
      : '';

  if (
    final &&
    TOURNAMENT.stats &&
    TOURNAMENT.stats.podium &&
    TOURNAMENT.stats.podium.length
  ) {

    html +=
      '<div class="podium-wrap">' +
        podiumHTML(
          TOURNAMENT.stats.podium
        ) +
      '</div>' +
      championStatsHTML(
        TOURNAMENT.stats
      );
  }

  html +=
    (round.groups || [])
      .map(
        (g, i) =>
          groupHTML(
            g,
            i,
            final
          )
      )
      .join('');

  content.innerHTML =
    html;

  renderRoundStats(
    round
  );

  bindCells(
    round
  );

  requestAnimationFrame(
    () => {

      if (scroll) {
        scroll.scrollTop = 0;
      }
    }
  );

  setTimeout(
    () => {

      if (scroll) {
        scroll.scrollTop = 0;
      }
    },
    0
  );
}

function validate(obj) {

  if (
    !obj ||
    !Array.isArray(
      obj.rounds
    )
  ) {
    throw new Error(
      'Invalid tournament data'
    );
  }

  return obj;
}

async function boot() {

  const content =
    document.getElementById(
      'content'
    );

  try {

    const r =
      await fetch(
        DATA_URL +
        '?v=' +
        Date.now(),
        {
          cache: 'no-store'
        }
      );

    if (!r.ok) {
      throw new Error(
        'HTTP ' +
        r.status +
        ' fetching tournament data'
      );
    }

    TOURNAMENT =
      validate(
        await r.json()
      );

    WITHDRAWN_SET =
      new Set(
        (
          TOURNAMENT.withdrawn ||
          []
        ).map(
          u =>
            (u || '')
              .toLowerCase()
        )
      );

    if (
      !TOURNAMENT.rounds.length
    ) {

      content.innerHTML =
        '<div class="error-msg">' +
        '⚠️ No rounds found yet in the tournament data file.' +
        '</div>';

      document.getElementById(
        'roundDropdown'
      ).style.display =
        'none';

      document.getElementById(
        'roundStats'
      ).style.display =
        'none';

      return;
    }

    if (!hasLoadedOnce) {

      activeRoundIdx =
        TOURNAMENT.rounds.length -
        1;

      hasLoadedOnce = true;

    } else {

      activeRoundIdx =
        Math.min(
          activeRoundIdx,
          TOURNAMENT.rounds.length -
          1
        );
    }

    renderRoundNav();

    renderActiveRound();

  } catch (e) {

    content.innerHTML =
      '<div class="error-msg">' +
      '⚠️ ' +
      esc(e.message) +
      '</div>';

    document.getElementById(
      'roundDropdown'
    ).style.display =
      'none';

    document.getElementById(
      'roundStats'
    ).style.display =
      'none';
  }
}

boot();

</script>
