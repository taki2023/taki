<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Chilli – World Bot Championship</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;margin:0;padding:0;background:transparent;display:flex;justify-content:center;}

:root{
  --fs-xs:  10px;
  --fs-sm:  11px;
  --fs-base:12px;
  --fs-md:  13px;
  --fs-lg:  15px;

  /* ══════════════════════════════════════════════════════
     ADJUST THE TOTAL GUI HEIGHT FROM HERE.
     --scroller-height controls how tall the scrolling list of
     rounds is. Header + credit box + footer add roughly 230px
     on top of this, so total widget height ≈ scroller-height + 230px.
     ══════════════════════════════════════════════════════ */
  --scroller-height: 300px;
}

/* ── WBC CARD ── */
.wbc-sb{
  font-family:'Nunito',sans-serif;
  width:100%;margin:0;
  background:#fff5f0;border-radius:28px;
  border:3px solid #e8553a;position:relative;
}

/* TOP HEADER */
.wbc-top{
  background:linear-gradient(135deg,#d93020 0%,#e85535 60%,#ef6640 100%);
  border-radius:24px 24px 0 0;padding:18px 16px 10px;
  text-align:center;position:relative;overflow:hidden;
}
.wbc-top::before{
  content:'';position:absolute;bottom:-10px;left:-10%;
  width:120%;height:20px;background:#fff5f0;border-radius:50%;
}
.chilli-deco{position:absolute;font-size:42px;opacity:.4;top:2px;}
.chilli-deco.left{left:6px;transform:rotate(-20deg);}
.chilli-deco.right{right:6px;transform:rotate(20deg);}
.section-title{font-family:'Fredoka One',cursive;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15);position:relative;z-index:1;}
.section-sub{font-size:var(--fs-sm);font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.8px;text-transform:uppercase;margin-top:3px;position:relative;z-index:1;}

/* INNER */
.inner{
  width:100%;padding:14px 20px 20px;
}

/* SECTION LABEL */
.sec-label{
  display:flex;align-items:center;gap:8px;
  font-family:'Fredoka One',cursive;font-size:14px;color:#c73520;
  margin-bottom:10px;margin-top:4px;
}
.sec-label .dot{width:12px;height:10px;border-radius:50%;background:#d93020;flex-shrink:0;}

/* ── SCROLLER WRAPPER ── */
.scroller-wrap{
  height:var(--scroller-height);
  overflow-y:auto;
  border-radius:16px;
  padding-right:4px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 6%,#000 94%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0%,#000 6%,#000 94%,transparent 100%);
}
.scroller-wrap::-webkit-scrollbar{width:4px;}
.scroller-wrap::-webkit-scrollbar-track{background:transparent;}
.scroller-wrap::-webkit-scrollbar-thumb{background:#e8aa98;border-radius:999px;}
.scroller-wrap{scrollbar-width:thin;scrollbar-color:#e8aa98 transparent;}

/* SEPARATOR */
.div{width:100%;height:18px;margin:10px auto 14px;position:relative;opacity:.95;}
.div::before,.div::after{content:"";position:absolute;left:0;width:100%;height:6px;border-radius:999px;}
.div::before{
  top:4px;
  background:radial-gradient(circle at 2% 50%,#e89080 0 6px,transparent 7px),
    radial-gradient(circle at 98% 50%,#e89080 0 6px,transparent 7px),
    linear-gradient(90deg,transparent 0%,#e89080 4%,#e08070 12%,#e99082 24%,#e18070 37%,#e89080 50%,#e28272 63%,#e99282 77%,#e08070 90%,#e89080 96%,transparent 100%);
  transform:rotate(-0.35deg);filter:blur(.15px);
}
.div::after{
  top:8px;left:4px;width:calc(100% - 8px);
  background:radial-gradient(circle at 2% 50%,#e89080 0 5px,transparent 6px),
    radial-gradient(circle at 98% 50%,#e89080 0 5px,transparent 6px),
    linear-gradient(90deg,transparent 0%,#ea9282 5%,#df8070 16%,#e89080 28%,#e18272 41%,#e99282 56%,#e08070 71%,#e89080 86%,#ea9282 95%,transparent 100%);
  transform:rotate(0.45deg);opacity:.82;
}

/* ── ROUND CARDS ── */
.rounds-list{
  display:flex;flex-direction:column;gap:10px;
  padding:6px 2px;
}

.round-card{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:18px;
  background:#fff;border:2px solid #f5c5b8;
  box-shadow:0 4px 0 #e8aa98;
  text-decoration:none;
  transition:all .18s ease;
  position:relative;overflow:hidden;
}
.round-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(217,48,32,.04),rgba(239,102,64,.02));
  opacity:0;transition:opacity .18s;
  pointer-events:none;
}
.round-card:hover{
  background:#fce8e0;border-color:#d93020;
  transform:translateY(-3px);
  box-shadow:0 8px 0 #d93020;
}
.round-card:hover::before{opacity:1;}

/* Round number chip */
.round-num{
  font-family:'Fredoka One',cursive;
  font-size:10px;color:#fff;
  background:linear-gradient(135deg,#d93020,#e85535);
  border-radius:8px;padding:3px 6px;
  box-shadow:0 2px 0 #8c1a10;
  flex-shrink:0;white-space:nowrap;
  align-self:flex-start;margin-top:2px;
}

/* Matchup: avatar vs avatar */
.matchup{
  display:flex;align-items:center;gap:6px;flex-shrink:0;
}
.matchup img{
  width:38px;height:38px;border-radius:50%;object-fit:cover;
  border:2px solid #e8553a;box-shadow:0 2px 0 #e8aa98;
  background:#fff8f5;flex-shrink:0;
}
.vs-badge{
  font-family:'Fredoka One',cursive;font-size:9px;color:#fff;
  background:#1a1a1a;border-radius:50%;
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 0 rgba(0,0,0,.3);flex-shrink:0;
}

/* Info */
.round-info{flex:1;min-width:0;}
.round-name{
  font-family:'Fredoka One',cursive;
  font-size:12.5px;color:#c73520;
  line-height:1.25;margin-bottom:4px;
}
.round-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:var(--fs-xs);font-weight:900;
  background:linear-gradient(135deg,rgba(217,48,32,.1),rgba(239,102,64,.07));
  color:#d93020;padding:2px 8px;border-radius:999px;
  border:1.5px solid #f5c5b8;
  text-transform:uppercase;letter-spacing:.5px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.round-badge .badge-dot{
  width:5px;height:5px;border-radius:50%;background:#d93020;
  animation:livePulse 1.8s ease-in-out infinite;flex-shrink:0;
}
@keyframes livePulse{
  0%,100%{box-shadow:0 0 0 2px rgba(217,48,32,.25);}
  50%{box-shadow:0 0 0 5px rgba(217,48,32,.08);}
}

/* Arrow */
.round-arr{
  font-size:20px;font-weight:900;color:#d93020;
  margin-left:2px;flex-shrink:0;
  transition:transform .2s ease,color .2s ease;
}
.round-card:hover .round-arr{transform:translateX(5px);color:#b01e10;}

/* ── CREDIT BOX ── */
.credit-box{
  background:#fff;border-radius:16px;
  border:2px dashed #e8553a;
  padding:13px 15px;text-align:center;
  margin-top:4px;
}
.credit-title{font-family:'Fredoka One',cursive;font-size:15px;color:#c73520;margin-bottom:6px;}
.credit-body{font-size:var(--fs-sm);font-weight:700;color:#9a2010;line-height:1.65;}
.credit-link{
  font-weight:900;color:#d93020;text-decoration:none;
  border-bottom:2px solid #f5c5b8;transition:border-color .15s,color .15s;
}
.credit-link:hover{color:#b01e10;border-color:#d93020;}
.crown{font-size:20px;display:block;margin-bottom:4px;}

/* FOOTER */
.footer{text-align:center;margin-top:14px;font-size:var(--fs-sm);font-weight:700;color:#e8553a;}
</style>
</head>
<body>

<div class="wbc-sb">

  <!-- TOP HEADER -->
  <div class="wbc-top">
    <div class="chilli-deco left">🌶</div>
    <div class="chilli-deco right">♞</div>
    <div class="section-title">🤖 World Bot Championship</div>
    <div class="section-sub">Engines Spicy Clash ♟</div>
  </div>

  <div class="inner">

    <!-- SECTION LABEL -->
    <div class="sec-label"><div class="dot"></div>All Rounds 🏆</div>

    <!-- SCROLLABLE ROUND CARDS -->
    <div class="scroller-wrap">
      <div class="rounds-list" id="roundsList"></div>
    </div>
    <!-- END SCROLLER -->

    <div class="div"></div>

    <!-- CREDIT BOX -->
    <div class="credit-box">
      <span class="crown">🎖️</span>
      <div class="credit-title">Organized by <a class="credit-link" href="https://www.chess.com/member/Trofandy" target="_blank" rel="noopener noreferrer">@Trofandy</a> 🌶</div>
      <div class="credit-body">
        Full credit for organizing and writing the forums of the whole bot championship goes to our beloved super admin
        <a class="credit-link" href="https://www.chess.com/member/Trofandy" target="_blank" rel="noopener noreferrer">@Trofandy</a>. ♟
      </div>
    </div>

    <div class="footer">🌶 Hot Chilli CheckMate © 2026 ♞</div>

  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   PASTE BOT AVATAR/PFP LINKS HERE.
   One row per round, in the same order as ROUNDS below:
   [ "left-bot-pfp-url", "right-bot-pfp-url" ]
   Leave "" empty to fall back to the default pawn icon.
   ══════════════════════════════════════════════════════════ */
const MAGNUS       = "https://images.chesscomfiles.com/uploads/v1/bot_personality/fc773c3c-5ca3-11ee-960b-2fa00c967982.359ef560.384x384o.6ef729300821.png";
const MECH_TURK    = "https://images.chesscomfiles.com/uploads/v1/bot_personality/c2fef3ca-1885-11ef-8bd3-c1a790534937.3a1e2c89.384x384o.c52834e58f39.png";
const TAL          = "https://images.chesscomfiles.com/uploads/v1/bot_personality/81522f56-9610-11ef-9928-a9c88d28a627.e8e03a29.384x384o.63cb88c95f59.png";
const ARONIAN      = "https://images.chesscomfiles.com/uploads/v1/bot_personality/0760a072-ac5a-11eb-9380-0de4effa151c.1bc042fd.384x384o.72d9d1274ef5.png";
const IAN_NEPO     = "https://images.chesscomfiles.com/uploads/v1/bot_personality/6756dcc0-3e73-11ec-86ee-79b6cb69a366.989dd54a.384x384o.216de4f40344.png";
const PAUL_MORPHY  = "https://images.chesscomfiles.com/uploads/v1/bot_personality/49d14a14-5979-11ee-896b-dbb3f6206aaf.b27199f4.384x384o.292feca66a5a.png";
const DING_LIREN   = "https://images.chesscomfiles.com/uploads/v1/bot_personality/ae23994c-d330-11ed-b694-0b48dafff0d7.62e74af4.384x384o.14ca8955b93f.png";
const CAPABLANCA   = "https://images.chesscomfiles.com/uploads/v1/bot_personality/53454316-960e-11ef-a8a4-757e35099e18.f2555bf7.384x384o.48a38baa1da8.png";
const FABIANO      = "https://images.chesscomfiles.com/uploads/v1/bot_personality/8bd3b42e-3e73-11ec-9e5e-7994d5ba605a.9e9fc6df.384x384o.603c9d56f6bf.png";
const REY_ENIGMA   = "https://images.chesscomfiles.com/uploads/v1/bot_personality/0ad67090-af06-11ee-9302-cfb45b774479.c052d679.384x384o.703ee7c68f7d.png";
const LASKER       = "https://images.chesscomfiles.com/uploads/v1/bot_personality/454a118a-9611-11ef-85a4-95dfb5c8f3b9.01d0c144.384x384o.a1a86c6fdf8f.png";

const BOT_AVATARS = [
  [MECH_TURK, MAGNUS],   // Round 1  – Mechanical Turk vs Magnus
  [MAGNUS, ""],          // Round 2  – Magnus vs Lucas Bot (no pfp provided)
  [MAGNUS, TAL],         // Round 3  – Magnus vs Tal
  [MAGNUS, REY_ENIGMA],  // Round 4  – Magnus vs Rey Enigma
  [TAL, CAPABLANCA],     // Round 5  – Tal vs Capablanca
  [LASKER, CAPABLANCA],  // Round 6  – Lasker vs Capablanca
  [CAPABLANCA, IAN_NEPO],// Round 7  – Capablanca vs Ian Nepomniachtchi
  [ARONIAN, IAN_NEPO],   // Round 8  – Aronian vs Ian Nepomniachtchi
  [FABIANO, IAN_NEPO],   // Round 9  – Fabiano vs Ian
  [PAUL_MORPHY, IAN_NEPO], // Round 10 – Paul Morphy vs Ian
  [DING_LIREN, IAN_NEPO],  // Round 11 – Ding vs Ian
  [DING_LIREN, IAN_NEPO],  // Round 12 – Semi Finals (Ding vs Ian)
  [DING_LIREN, IAN_NEPO],  // Round 13 – World Bot Chess Championship (Ding vs Ian)
  [DING_LIREN, IAN_NEPO],  // Tie Break (Ding vs Ian)
  [DING_LIREN, IAN_NEPO]   // Finale Results (Ding vs Ian)
];

const DEFAULT_AVATAR = "https://taki2023.github.io/taki/default-pawn.png";

const ROUNDS = [
  { num:"R1",  name:"Mechanical Turk vs Magnus",        badge:"Round 1",  url:"https://www.chess.com/clubs/forum/view/bot-world-chess-championship-2026" },
  { num:"R2",  name:"Magnus vs Lucas Bot",               badge:"Round 2 · by @BIitzel", url:"https://www.chess.com/clubs/forum/view/round-2-of-the-worl-bot-chess-championship" },
  { num:"R3",  name:"Magnus vs Tal",                      badge:"Round 3 · by @Vaseegaren-V", url:"https://www.chess.com/clubs/forum/view/world-chess-bot-championship-round-3" },
  { num:"R4",  name:"Magnus vs Rey Enigma",               badge:"Round 4 · by @Tengen", url:"https://www.chess.com/clubs/forum/view/round-4-world-bot-chess-championship" },
  { num:"R5",  name:"Tal vs Capablanca",                  badge:"Round 5 · by @Vaseegaren-V & @Iamplayerofchess", url:"https://www.chess.com/clubs/forum/view/world-bot-chess-championship-round-5" },
  { num:"R6",  name:"Lasker vs Capablanca",                badge:"Round 6 · by @Vaseegaren", url:"https://www.chess.com/clubs/forum/view/bot-world-championship-round-6" },
  { num:"R7",  name:"Capablanca vs Ian Nepomniachtchi",   badge:"Round 7 · by @carls-bad", url:"https://www.chess.com/clubs/forum/view/world-bot-chess-championship-round-7-1" },
  { num:"R8",  name:"Aronian vs Ian Nepomniachtchi",      badge:"Round 8 · by @carls-bad", url:"https://www.chess.com/clubs/forum/view/world-bot-chess-championship-round-8" },
  { num:"R9",  name:"Fabiano vs Ian",                      badge:"Round 9", url:"https://www.chess.com/clubs/forum/view/world-bot-chess-championship-round-8-1" },
  { num:"R10", name:"Paul Morphy vs Ian",                  badge:"Round 10 · @BIitzel special", url:"https://www.chess.com/clubs/forum/view/world-bot-chess-championship-round-10-blitzel-special" },
  { num:"R11", name:"Ding vs Ian",                         badge:"Round 11 · 2023 rematch", url:"https://www.chess.com/clubs/forum/view/world-bot-chess-championship-round-11-taki-special-quarter-finals" },
  { num:"R12", name:"Semi Finals",                         badge:"Round 12 · @taki special", url:"https://www.chess.com/clubs/forum/view/world-bot-chess-championship-round-12-semi-finals-taki-special" },
  { num:"R13", name:"World Bot Chess Championship",       badge:"Round 13 · @taki special", url:"https://www.chess.com/clubs/forum/view/world-bot-chess-championship-taki-special-round-13" },
  { num:"TB",  name:"Tie Break",                           badge:"Tie Break", url:"https://www.chess.com/clubs/forum/view/the-end-for-now" },
  { num:"FR",  name:"Finale Results",                      badge:"Final Results", url:"https://www.chess.com/clubs/forum/view/the-rusults" }
];

function renderRounds(){
  const list = document.getElementById('roundsList');
  list.innerHTML = ROUNDS.map((r, i) => {
    const av = BOT_AVATARS[i] || ["",""];
    const left  = av[0] || DEFAULT_AVATAR;
    const right = av[1] || DEFAULT_AVATAR;
    return `
      <a class="round-card" href="${r.url}" target="_blank" rel="noopener noreferrer">
        <div class="round-num">${r.num}</div>
        <div class="matchup">
          <img src="${left}" onerror="this.src='${DEFAULT_AVATAR}'">
          <div class="vs-badge">VS</div>
          <img src="${right}" onerror="this.src='${DEFAULT_AVATAR}'">
        </div>
        <div class="round-info">
          <div class="round-name">${r.name}</div>
          <div class="round-badge"><span class="badge-dot"></span>${r.badge}</div>
        </div>
        <span class="round-arr">›</span>
      </a>`;
  }).join("");
}
renderRounds();
</script>

</body>
</html>
