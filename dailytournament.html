<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spicy Daily Club Tournament — Pairings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;margin:0;padding:0;background:#1a1a1a;}
body{display:block;font-family:'Nunito',sans-serif;}

:root{
  --fs-xs:  10px;
  --fs-sm:  11px;
  --fs-base:12px;
  --fs-md:  13px;
  --fs-lg:  15px;

  --cream:      #FFF7F1;
  --cream-deep: #FFEADC;
  --paper:      #FFFFFF;
  --ink:        #6B2A1E;
  --ink-soft:   #B4685A;
  --ink-faint:  #E8B6A6;
  --red:        #FF4433;
  --red-mid:    #E0301F;
  --red-deep:   #B3230F;
  --orange:     #FF8A50;
  --peach:      #FFD7C2;
  --line:       #FFDCC9;
  --good:       #34C759;
  --good-deep:  #1B8A3A;
  --gold:       #FFB020;
  --gold-deep:  #B4790C;
  --silver:     #B8C0CC;
  --bronze:     #D98A4B;
  --violet:     #7C5CFC;
  --blue:       #1D4ED8;
  --blue-soft:  #E1EEFF;
  --grey-band:  #9AA3AF;
  --shadow-red: rgba(224,48,31,.16);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --ease:   cubic-bezier(.22,.61,.36,1);
}

.sb{
  font-family:'Nunito',sans-serif;
  width:100%;max-width:900px;margin:0 auto;
  background:var(--cream);border-radius:32px;
  border:none;position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 20px 50px -18px rgba(179,35,15,.35);
  overflow:visible;isolation:isolate;
}

/* ══ HEADER ══ */
.sb-top{
  background:
    radial-gradient(120% 160% at 15% -30%, rgba(255,255,255,.35), transparent 55%),
    linear-gradient(135deg,#FF5B3D 0%,#FF4433 45%,#E0301F 100%);
  border-radius:32px 32px 0 0;padding:16px 18px 34px;
  text-align:center;position:relative;overflow:hidden;
}
.sb-top::before{
  content:'';position:absolute;bottom:-1px;left:0;right:0;
  height:26px;background:var(--cream);
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
  transform:scaleX(1.3);
}
.chilli-deco{
  position:absolute;top:14px;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;line-height:1;
  background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.35);
  box-shadow:0 4px 10px -3px rgba(0,0,0,.2);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));
  animation:wiggle 3.4s ease-in-out infinite;
}
.chilli-deco.left{left:14px;font-size:24px;transform-origin:60% 80%;}
.chilli-deco.right{right:14px;font-size:16px;transform-origin:40% 80%;animation-delay:.6s;}
.chilli-deco.right span{display:inline-block;transform:scale(1.7);}
@keyframes wiggle{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(10deg);}}

.event-title{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;color:#fff;
  text-shadow:0 3px 0 rgba(150,20,10,.35);position:relative;z-index:1;letter-spacing:.2px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.event-title svg{width:22px;height:22px;fill:#fff;flex-shrink:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));}
.event-sub{
  display:inline-flex;align-items:center;gap:6px;
  font-size:9.5px;font-weight:800;color:#fff;letter-spacing:.6px;text-transform:uppercase;
  margin-top:10px;position:relative;z-index:1;
  background:rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;
  backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.3);
}
.event-sub::before{content:'🌶';font-size:10px;}

.inner{width:100%;margin:0 auto;padding:0 16px 20px;}

.sec-label{
  display:flex;align-items:center;gap:8px;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;color:var(--red-mid);
  margin-bottom:10px;margin-top:16px;
}
.sec-label .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--orange));flex-shrink:0;box-shadow:0 0 0 4px rgba(255,68,51,.14);}

/* ══ ROUND BAR ══ */
.round-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:-16px 0 16px;z-index:6;position:relative;flex-wrap:wrap;
  row-gap:10px;
}
.round-stats{display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:6px;}
.stat-pill{
  display:inline-flex;align-items:center;gap:5px;
  font-family:'Nunito',sans-serif;font-size:10px;font-weight:800;color:var(--ink-soft);
  background:rgba(255,255,255,.65);backdrop-filter:blur(10px) saturate(1.3);
  padding:6px 11px;border-radius:999px;white-space:nowrap;flex-shrink:0;
  box-shadow:0 0 0 1px rgba(255,220,201,.7) inset,0 4px 10px -6px rgba(179,35,15,.25);
}
.stat-pill .stat-num{color:var(--red-mid);font-weight:900;}

/* ══ ROUND DROPDOWN ══ */
.round-dropdown{position:relative;z-index:6;margin-left:auto;}
.round-dropdown-btn{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:auto;min-width:150px;padding:11px 16px;border-radius:18px;border:none;cursor:pointer;
  background:rgba(255,255,255,.75);backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:0 10px 26px -10px rgba(179,35,15,.35),0 0 0 1px rgba(255,220,201,.7) inset;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;color:var(--red-mid);
  transition:background .18s var(--ease);
}
.round-dropdown-btn:hover{background:#FFF1EA;}
.round-dropdown-btn .chev{width:11px;height:11px;fill:var(--red-mid);transition:transform .22s var(--spring);flex-shrink:0;}
.round-dropdown.open .round-dropdown-btn .chev{transform:rotate(180deg);}
.round-dropdown-list{
  position:absolute;top:calc(100% + 8px);right:0;left:auto;
  width:max-content;min-width:100%;max-width:240px;
  background:var(--paper);border-radius:18px;overflow:hidden;
  box-shadow:0 16px 36px -10px rgba(224,48,31,.4),0 0 0 1px var(--peach);
  max-height:280px;overflow-y:auto;
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;
  transition:opacity .16s var(--ease),transform .16s var(--ease);
}
.round-dropdown.open .round-dropdown-list{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.round-dropdown-list::-webkit-scrollbar{width:5px;}
.round-dropdown-list::-webkit-scrollbar-thumb{background:var(--peach);border-radius:3px;}
.round-dropdown-item{
  padding:12px 18px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
  color:var(--ink);cursor:pointer;transition:background .14s;border-top:1px solid var(--cream-deep);
}
.round-dropdown-item:first-child{border-top:none;}
.round-dropdown-item:hover{background:#FFF1EA;}
.round-dropdown-item.active{
  background:linear-gradient(135deg,#FF5B3D,var(--red-mid));color:#fff;
}

.div{width:100%;height:2px;margin:18px 2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent);
}

/* ══ GROUP CARD ══ */
.group-card{
  background:var(--paper);border-radius:24px;border:none;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 8px 22px -10px rgba(224,48,31,.32);
  padding:6px;margin-bottom:16px;overflow:visible;
}

.table-scroll{overflow-x:auto;border-radius:18px;-webkit-overflow-scrolling:touch;}
.table-scroll::-webkit-scrollbar{height:6px;}
.table-scroll::-webkit-scrollbar-thumb{background:var(--peach);border-radius:3px;}
.table-scroll::-webkit-scrollbar-track{background:transparent;}

table.pairings{width:100%;border-collapse:separate;border-spacing:0;}
table.pairings thead th{
  background:linear-gradient(135deg,#3a2018,#241009);
  color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;font-size:12.5px;
  padding:11px 5px;text-align:center;white-space:nowrap;position:relative;
}
table.pairings thead th:first-child{text-align:left;padding-left:18px;border-radius:16px 0 0 0;}
table.pairings thead th:last-child{border-radius:0 16px 0 0;}
table.pairings thead th .col-ico{display:flex;align-items:center;justify-content:center;gap:4px;}
table.pairings thead th .col-ico svg{fill:#fff;width:17px;height:17px;}
.th-group-label{display:flex;align-items:center;gap:7px;font-size:13px;}
.th-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--red),var(--orange));}

table.pairings tbody tr{background:var(--paper);transition:background .15s;position:relative;}
table.pairings tbody tr:nth-child(odd){background:#FFFAF7;}
table.pairings tbody tr:hover{background:#FFF1EA;}

/* qualification stripes on the left edge of each row, same idea as
   Champions League / domestic league tables: blue = through to the
   next round, grey = still alive, red = eliminated */
table.pairings tbody tr.band-through{box-shadow:inset 4px 0 0 var(--blue);}
table.pairings tbody tr.band-out{box-shadow:inset 4px 0 0 var(--red-deep);}
table.pairings tbody tr.band-mid{box-shadow:inset 4px 0 0 var(--grey-band);}

table.pairings tbody td{
  padding:9px 5px;text-align:center;font-size:12px;font-weight:800;color:var(--ink);
  border-top:1px solid var(--cream-deep);white-space:nowrap;
}
table.pairings tbody td:first-child{text-align:left;padding-left:14px;}

.club-cell{display:flex;align-items:center;gap:9px;min-width:210px;}
.club-rank{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:11px;color:#fff;
  background:linear-gradient(135deg,var(--peach),var(--orange));
}
/* gold/silver/bronze ranks only apply once a round is down to a single
   group — the true final standings */
table.final-round .club-rank.r1{background:linear-gradient(135deg,var(--gold),#E0301F);box-shadow:0 2px 8px -2px rgba(255,176,32,.6);}
table.final-round .club-rank.r2{background:linear-gradient(135deg,var(--silver),#8E97A8);}
table.final-round .club-rank.r3{background:linear-gradient(135deg,var(--bronze),#96591F);}
.club-avatar-link{display:inline-flex;flex-shrink:0;border-radius:11px;}
.club-avatar{width:32px;height:32px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--peach);object-fit:cover;flex-shrink:0;background:#FFE9DF;display:block;}
.club-name-wrap{display:flex;flex-direction:column;text-align:left;min-width:0;}
.club-host-tag{
  display:inline-flex;align-items:center;gap:3px;
  font-size:9px;font-weight:900;letter-spacing:.3px;text-transform:uppercase;
  color:var(--good-deep);background:#E4F8E9;border:1px solid #BFEACB;
  padding:1px 7px;border-radius:999px;margin-top:3px;white-space:nowrap;width:fit-content;
}
.club-host-tag::before{content:'★';font-size:8px;}
.club-name{font-size:12px;font-weight:800;color:var(--red-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;}
.club-name a{color:inherit;text-decoration:none;}
.club-name a:hover{text-decoration:underline;}

.cell-x{color:var(--ink-faint);font-size:16px;font-weight:900;}

.cell-board{display:inline-flex;align-items:center;justify-content:center;}
.cell-board svg{fill:#9AA3AF;width:19px;height:19px;opacity:.9;}
.cell-board.live svg{fill:#3B82F6;}
.cell-link{text-decoration:none;display:inline-flex;cursor:pointer;}

.badge{display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;text-decoration:none;}
.badge.win{color:var(--blue);}
.badge.draw{color:var(--ink-soft);}
.badge.loss{color:var(--red-deep);}

.standing-val{display:inline-flex;align-items:center;gap:4px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:var(--red-mid);}
.tiebreak-val{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:600;color:var(--ink-soft);}

.table-empty{padding:26px 14px;text-align:center;font-size:12px;font-weight:800;color:var(--ink-faint);}

/* ══ SKELETON PLACEHOLDERS (sized to match final content so nothing jumps) ══ */
.skel{
  display:inline-block;border-radius:6px;
  background:linear-gradient(90deg,#F1E4DB 25%,#FFEFE6 37%,#F1E4DB 63%);
  background-size:400% 100%;
  animation:skel-shimmer 1.4s ease infinite;
}
@keyframes skel-shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.skel-avatar{width:32px;height:32px;border-radius:9px;flex-shrink:0;}
.skel-rank{width:22px;height:22px;border-radius:50%;flex-shrink:0;}
.skel-name{width:110px;height:11px;border-radius:5px;}
.skel-cell{width:19px;height:19px;border-radius:50%;}
.skel-standing{width:22px;height:15px;border-radius:5px;}
.skel-tiebreak{width:18px;height:12px;border-radius:5px;}

/* ══ LEGEND ══ */
.legend-card{
  background:var(--paper);border-radius:18px;border:none;padding:13px 14px;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 5px 14px -6px rgba(224,48,31,.25);
  display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:14px;
}
.legend-item{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;color:var(--ink-soft);}
.legend-swatch{width:16px;height:16px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;}
.legend-swatch.win{background:#E1EEFF;border:1.5px solid #BBD3FF;color:var(--blue);}
.legend-swatch.draw{background:#F1EEEE;border:1.5px solid #DCD3D0;color:var(--ink-soft);}
.legend-swatch.loss{background:#FFE4E1;border:1.5px solid #FFC5BE;color:var(--red-deep);}
.legend-swatch.pending svg{fill:#9AA3AF;width:12px;height:12px;}
.legend-swatch.live svg{fill:#3B82F6;width:12px;height:12px;}
.legend-swatch.through{background:var(--blue);}
.legend-swatch.eliminated{background:var(--red-deep);}

.footer{text-align:center;margin-top:6px;font-size:var(--fs-sm);font-weight:800;color:var(--ink-faint);letter-spacing:.2px;}

.load-msg{text-align:center;padding:30px 14px;font-size:13px;font-weight:800;color:var(--ink-soft);}
.error-msg{text-align:center;padding:20px 14px;font-size:12px;font-weight:800;color:var(--red-deep);background:#FFF1EE;border-radius:14px;margin-bottom:14px;}

/* ══ HOVER POPOVER (match preview) ══ */
#matchPopover{
  position:fixed;z-index:9999;pointer-events:none;
  width:220px;background:var(--paper);border-radius:18px;padding:14px;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.35),0 0 0 1px var(--peach);
  opacity:0;transform:translateY(6px) scale(.97);
  transition:opacity .14s var(--ease),transform .14s var(--ease);
  font-family:'Nunito',sans-serif;
}
#matchPopover.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.mp-status{
  display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:900;
  text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:999px;
  margin-bottom:10px;
}
.mp-status.live{background:#FFE9DF;color:var(--red-mid);}
.mp-status.live .mp-dot{width:6px;height:6px;border-radius:50%;background:var(--good);animation:livePulse 1.4s ease-in-out infinite;}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 2px rgba(52,199,89,.25);}50%{box-shadow:0 0 0 5px rgba(52,199,89,.05);}}
.mp-status.finished{background:#FFF1D6;color:#B45309;}
.mp-status.pending{background:#F1EEEE;color:var(--ink-soft);}
.mp-teams-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px;}
.mp-team{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0;}
.mp-team img{width:44px;height:44px;border-radius:10px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--peach);object-fit:cover;}
.mp-team-name{font-size:9px;font-weight:800;color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75px;}
.mp-vs{font-family:'Fredoka',sans-serif;font-weight:600;font-size:11px;color:var(--ink-faint);flex-shrink:0;padding-top:14px;}
.mp-score-row{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;margin-bottom:10px;}
.mp-score-num.win{color:var(--good-deep);}
.mp-score-num.lose{color:var(--red-deep);}
.mp-score-num.tie{color:var(--ink-faint);}
.mp-score-sep{color:var(--ink-faint);font-size:14px;}
.mp-meta{display:flex;align-items:center;justify-content:center;gap:6px;font-size:9.5px;font-weight:700;color:var(--ink-faint);margin-bottom:10px;}
.mp-watch{
  display:block;width:100%;text-align:center;padding:8px;border-radius:999px;
  background:linear-gradient(135deg,#FF5B3D,var(--red-mid));color:#fff;
  font-size:11px;font-weight:900;text-decoration:none;box-shadow:0 4px 0 var(--red-deep);
}

@media(max-width:480px){
  .event-title{font-size:18px;}
  .club-name{max-width:150px;}
  .club-cell{min-width:0;}
  .round-bar{flex-wrap:nowrap;gap:6px;}
  .round-stats{gap:4px;flex-wrap:nowrap;}
  .stat-pill{padding:5px 8px;font-size:8.5px;gap:3px;}
  .round-dropdown{margin-left:auto;flex-shrink:0;}
  .round-dropdown-btn{min-width:0;padding:8px 10px;font-size:12px;gap:5px;}
  .round-dropdown-btn .chev{width:9px;height:9px;}
}
</style>
</head>
<body>
<div class="sb">

  <div class="sb-top">
    <div class="chilli-deco left">🌶</div>
    <div class="chilli-deco right"><span>♞</span></div>
    <div class="event-title">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M13.07 22.03h-2.13c-1.03 0-1.43-.4-1.43-1.43V9.43c0-1.03.4-1.43 1.43-1.43h2.13c1.03 0 1.43.4 1.43 1.43V20.6c0 1.03-.4 1.43-1.43 1.43zm-7.5 0H3.44c-1.03 0-1.43-.4-1.43-1.43v-7.17c0-1.03.4-1.43 1.43-1.43h2.13C6.6 12 7 12.4 7 13.43v7.17c0 1.03-.4 1.43-1.43 1.43zM2.43 10V8.77l2-1.5c1-.73 1.4-1.07 1.4-1.47 0-.43-.43-.73-1.07-.73-1 0-1.73.93-1.73.93l-.77-.67s.83-1.27 2.47-1.27c1.17 0 2.1.67 2.1 1.7 0 .8-.57 1.37-1.5 2.07L3.76 9h3.23v1H2.43zm18.14 12.03h-2.13c-1.03 0-1.43-.4-1.43-1.43v-5.17c0-1.03.4-1.43 1.43-1.43h2.13c1.03 0 1.43.4 1.43 1.43v5.17c0 1.03-.4 1.43-1.43 1.43zm-8.74-16V1.56l-2 1.17-.47-.87 2.87-1.7h.6v5.87h-1zm7.6 6.1c-1.63 0-2.57-1.07-2.57-1.07l.67-.77s.83.83 1.93.83c.77 0 1.23-.4 1.23-.9 0-.53-.47-.77-1.43-.77h-.8v-1h.8c.97 0 1.3-.27 1.3-.8s-.43-.83-1.13-.83c-1.2 0-1.9.83-1.9.83l-.67-.77s.83-1.07 2.47-1.07c1.3 0 2.23.7 2.23 1.73 0 1.17-1.23 1.8-2.3 1.8v-.77c1.07 0 2.43.63 2.43 1.83 0 1-.97 1.7-2.27 1.7l.01.03z"></path></svg>
      Spicy Daily Club Tournament
    </div>
    <div class="event-sub">Pairings &amp; Live Standings</div>
  </div>

  <div class="inner">

    <div class="round-bar">
      <div class="round-stats" id="roundStats" style="display:none;">
        <span class="stat-pill" id="statMatches">– / – matches</span>
        <span class="stat-pill" id="statGames">– / – games</span>
      </div>
      <div id="roundDropdown" class="round-dropdown" style="display:none;">
        <button class="round-dropdown-btn" id="roundDropdownBtn" type="button">
          <span id="roundDropdownLabel">Round 1</span>
          <svg class="chev" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 15.5L4.5 8l1.4-1.4L12 12.7l6.1-6.1L19.5 8z"></path></svg>
        </button>
        <div class="round-dropdown-list" id="roundDropdownList"></div>
      </div>
    </div>

    <div id="content">
      <div class="load-msg">🌶 Loading tournament data…</div>

const clubCache  = {}; // slug -> resolved { name, icon, slug }

// chess.com's API doesn't like being hammered with parallel requests,
// so every fetch runs through a small concurrency-limited queue
function makeLimiter(concurrency) {
  let active = 0;
  const queue = [];
  function runNext() {
    if (active >= concurrency || queue.length === 0) return;
    active++;
    const { fn, resolve, reject } = queue.shift();
    fn().then(
      (v) => { active--; resolve(v); runNext(); },
      (e) => { active--; reject(e); runNext(); }
    );
  }
  return function limit(fn) {
    return new Promise((resolve, reject) => {
      queue.push({ fn, resolve, reject });
      runNext();
    });
  };
}
const limit = makeLimiter(2);

function slugFromClubApiId(idUrl) {
  if (!idUrl) return '';
  const parts = idUrl.split('/').filter(Boolean);
  return (parts[parts.length - 1] || '').toLowerCase();
}

function matchIdFromLink(link) {
  if (!link) return '';
  const clean = link.split('?')[0].split('#')[0];
  const parts = clean.split('/').filter(Boolean);
  for (let i = parts.length - 1; i >= 0; i--) {
    if (/^\d+$/.test(parts[i])) return parts[i];
  }
  return '';
}

async function fetchClub(slug) {
  if (!slug) return { name: slug, icon: DEFAULT_CLUB_ICON, slug: slug };
  if (clubCache[slug]) return clubCache[slug];
  const p = limit(async () => {
    try {
      const r = await fetch('https://api.chess.com/pub/club/' + encodeURIComponent(slug));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      return { name: d.name || prettifySlug(slug), icon: d.icon || DEFAULT_CLUB_ICON, slug: slug };
    } catch (e) {
      return { name: prettifySlug(slug), icon: DEFAULT_CLUB_ICON, slug: slug };
    }
  });
  clubCache[slug] = p;
  return p;
}

async function fetchMatch(link) {
  const id = matchIdFromLink(link);
  if (!id) return null;
  if (matchCache[id] !== undefined) return matchCache[id];
  const p = limit(async () => {
    try {
      const r = await fetch('https://api.chess.com/pub/match/' + id);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      return null;
    }
  });
  matchCache[id] = await p;
  return matchCache[id];
}

function prettifySlug(slug) {
  return (slug || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function prettifyGroupName(name) {

function matchView(matchJson, slugA, slugB) {
  if (!matchJson || !matchJson.teams) return null;
  const t1 = matchJson.teams.team1, t2 = matchJson.teams.team2;
  const t1Slug = slugFromClubApiId(t1 && t1['@id']);
  const t2Slug = slugFromClubApiId(t2 && t2['@id']);
  let teamA, teamB;
  if (t1Slug === slugA.toLowerCase() || t2Slug === slugB.toLowerCase()) {
    teamA = t1; teamB = t2;
  } else if (t2Slug === slugA.toLowerCase() || t1Slug === slugB.toLowerCase()) {
    teamA = t2; teamB = t1;
  } else {
    teamA = t1; teamB = t2;
  }
  return {
    status: matchJson.status || 'registered',
    boards: matchJson.boards,
    timeClass: (matchJson.settings && matchJson.settings.time_class) || 'daily',
    url: matchJson.url,
    scoreA: teamA ? Number(teamA.score) : null,
    scoreB: teamB ? Number(teamB.score) : null
  };
}

/* turns TOURNAMENT_DATA into { rounds: [...] } */
function parseTournamentData(text) {
  const rounds = [];
  let currentRound = null;
  let currentGroup = null;
  let groupRows = [];

  function flushGroup() {
    if (!currentGroup) return;
    const clubs = groupRows.map(r => r.slug);
    const matches = [];
    for (let i = 0; i < clubs.length; i++) {
      for (let j = i + 1; j < clubs.length; j++) {
        const cellIJ = (groupRows[i].cells[j] || '').trim();
        const cellJI = (groupRows[j].cells[i] || '').trim();
        let link = '';
        [cellIJ, cellJI].forEach(c => {
          if (c && c.toLowerCase() !== 'x') link = c;
        });
        matches.push({ clubA: clubs[i], clubB: clubs[j], link: link });
      }
    }
    currentGroup.clubs = clubs;
    currentGroup.matches = matches;
    currentRound.groups.push(currentGroup);
    currentGroup = null;
    groupRows = [];
  }

  text.split('\n').forEach(rawLine => {
    const line = rawLine.replace(/\r$/, '');
    if (!line.trim()) return;
    const cells = line.split('\t');
    const first = (cells[0] || '').trim();

    if (/^round\b/i.test(first)) {
      flushGroup();
      if (currentRound) rounds.push(currentRound);
      currentRound = { name: first, groups: [] };
      return;
    }
    if (/^group\b/i.test(first)) {
      flushGroup();
      if (!currentRound) currentRound = { name: 'Round 1', groups: [] };
      currentGroup = { name: first };
      return;
    }
    if (!currentGroup) return;
    groupRows.push({ slug: first, cells: cells.slice(1) });
  });
  flushGroup();
  if (currentRound) rounds.push(currentRound);

  return { rounds };
}

function scoreCompareClasses(scoreA, scoreB) {
  const hasBoth = scoreA != null && scoreB != null && !isNaN(scoreA) && !isNaN(scoreB);

  if (scoreA > scoreB) return { a: 'win', b: 'lose' };

  return { a: 'tie', b: 'tie' };
}

function popoverHTML(clubA, clubB, view) {

  const scoreA = rawScoreA != null ? rawScoreA : '–';

  const cls = scoreCompareClasses(rawScoreA, rawScoreB);
  const boards = view && view.boards ? view.boards : '?';
  const timeClass = view && view.timeClass ? (view.timeClass[0].toUpperCase() + view.timeClass.slice(1)) : 'Daily';

async function renderActiveRound() {
  const content = document.getElementById('content');
  const round = TOURNAMENT.rounds[activeRoundIdx];
  if (!round) {
    content.innerHTML = '<div class="load-msg">No round data found. Check the TOURNAMENT_DATA matrix at the top of the script.</div>';
    document.getElementById('roundStats').style.display = 'none';
    return;

  if (!round.groups.length) {
    content.innerHTML = '<div class="table-empty">No groups in this round yet.</div>';
    document.getElementById('roundStats').style.display = 'none';
    return;
  }

  const isLastRound = round.groups.length === 1;

  content.innerHTML = round.groups.map((g, gi) => groupSkeletonHTML(g, gi, isLastRound)).join('');
  const matchesTotal = round.groups.reduce((sum, g) => sum + g.matches.length, 0);
  resetRoundStats(matchesTotal);

  const groupStats = await Promise.all(round.groups.map((g, gi) => fillGroup(g, gi, isLastRound)));

    matchesDone: acc.matchesDone + s.matchesDone,
    matchesTotal: acc.matchesTotal + s.matchesTotal,
    gamesDone: acc.gamesDone + s.gamesDone,
    gamesTotal: acc.gamesTotal + s.gamesTotal
  }), { matchesDone: 0, matchesTotal: 0, gamesDone: 0, gamesTotal: 0 });
  renderRoundStats(roundStats);
}

// which qualification band a row lands in, based on its rank in the
// group (0-indexed) and how many clubs are in that group
function qualificationBandClass(rank, clubCount) {
  if (rank < ADVANCING_CLUBS_PER_GROUP) return 'band-through';
  if (rank >= clubCount - ELIMINATE_SPOTS) return 'band-out';
  return 'band-mid';
}

async function fillGroup(group, gi, isLastRound) {
  const clubs = group.clubs;

  const clubInfos = {};
  await Promise.all(clubs.map(async slug => { clubInfos[slug] = await fetchClub(slug); }));

  const matchViews = {};
  await Promise.all(group.matches.map(async m => {
    let view = null;
    if (m.link) {
      const json = await fetchMatch(m.link);
      view = matchView(json, m.clubA, m.clubB);
      if (view && !view.url) view.url = m.link;
    }
    matchViews[m.clubA + '|' + m.clubB] = { view: view, link: m.link, clubA: m.clubA, clubB: m.clubB };
    matchViews[m.clubB + '|' + m.clubA] = { view: view, link: m.link, clubA: m.clubA, clubB: m.clubB, flipped: true };
  }));

  function getView(a, b) {
    const rec = matchViews[a + '|' + b];
    if (!rec) return { view: null, link: '' };
    return rec;
  }

  const score = {}, tiebreak = {};
  clubs.forEach(c => { score[c] = 0; tiebreak[c] = 0; });
  let matchesDone = 0, gamesDone = 0, gamesTotal = 0;
  const matchesTotal = group.matches.length;
  group.matches.forEach(m => {
    const rec = matchViews[m.clubA + '|' + m.clubB];
    const view = rec && rec.view;
    if (view && view.status === 'finished') matchesDone++;
    if (view && view.boards) gamesTotal += (Number(view.boards) || 0) * 2;
    if (view && view.scoreA != null && view.scoreB != null && !isNaN(view.scoreA) && !isNaN(view.scoreB)) {
      gamesDone += (Number(view.scoreA) + Number(view.scoreB));
    }
  });

  clubs.forEach(a => {
    clubs.forEach(b => {
      if (a === b) return;
      const rec = getView(a, b);
      if (!rec.view) return;
      const flippedA = rec.flipped ? rec.view.scoreB : rec.view.scoreA;
      const flippedB = rec.flipped ? rec.view.scoreA : rec.view.scoreB;
      if (flippedA != null) tiebreak[a] += flippedA;
      if (rec.view.status === 'finished') {
        const pts = pointsFromScores(flippedA, flippedB);
        if (pts != null) score[a] += pts;
      }
    });
  });

  const order = clubs.slice().sort((x, y) => (score[y] - score[x]) || (tiebreak[y] - tiebreak[x]));

  const thead = document.getElementById('ghead-' + gi);
  thead.innerHTML = headerRowHTML(order.length, prettifyGroupName(group.name));

  const tbody = document.getElementById('gbody-' + gi);
  let bodyHTML = '';
  order.forEach((rowSlug, rank) => {
    const info = clubInfos[rowSlug] || { name: prettifySlug(rowSlug), icon: DEFAULT_CLUB_ICON };
    const rankClass = rank === 0 ? 'r1' : rank === 1 ? 'r2' : rank === 2 ? 'r3' : '';
    const bandClass = isLastRound ? '' : qualificationBandClass(rank, order.length);
    bodyHTML += `<tr class="${bandClass}">
      <td>
        <div class="club-cell">
          <div class="club-rank ${rankClass}">${rank + 1}</div>
          <a class="club-avatar-link" href="https://www.chess.com/club/${rowSlug}" target="_blank" rel="noopener noreferrer">
            <img class="club-avatar" src="${info.icon}" onerror="this.src='${DEFAULT_CLUB_ICON}'">
          </a>
          <div class="club-name-wrap">
            <div class="club-name"><a href="https://www.chess.com/club/${rowSlug}" target="_blank" rel="noopener noreferrer">${info.name}</a></div>
            ${rowSlug === HOST_CLUB_SLUG ? '<div class="club-host-tag">Host Club</div>' : ''}
          </div>
        </div>
      </td>`;

    order.forEach(colSlug => {
      if (colSlug === rowSlug) { bodyHTML += `<td><span class="cell-x">✕</span></td>`; return; }
      const rec = getView(rowSlug, colSlug);
      const flippedA = rec.view ? (rec.flipped ? rec.view.scoreB : rec.view.scoreA) : null;
      const flippedB = rec.view ? (rec.flipped ? rec.view.scoreA : rec.view.scoreB) : null;
      const link = (rec.view && rec.view.url) || rec.link || '';

      let cellInner;
      if (rec.view && rec.view.status === 'finished') {
        const pts = pointsFromScores(flippedA, flippedB);
        cellInner = `<a class="badge ${pointsClass(pts)}" data-a="${rowSlug}" data-b="${colSlug}" ${link ? `href="${link}" target="_blank" rel="noopener noreferrer"` : ''}>${pointsLabel(pts)}</a>`;
      } else {
        const liveClass = link ? ' live' : '';
        cellInner = link
          ? `<a class="cell-link cell-board${liveClass}" data-a="${rowSlug}" data-b="${colSlug}" href="${link}" target="_blank" rel="noopener noreferrer">${BOARD_SVG}</a>`
          : `<span class="cell-board" data-a="${rowSlug}" data-b="${colSlug}">${BOARD_SVG}</span>`;
      }
      bodyHTML += `<td>${cellInner}</td>`;
    });

    bodyHTML += `
      <td><span class="standing-val">${score[rowSlug]}</span></td>
      <td><span class="tiebreak-val">${tiebreak[rowSlug]}</span></td>
    </tr>`;
  });
  tbody.innerHTML = bodyHTML;

  tbody.querySelectorAll('[data-a][data-b]').forEach(el => {
    el.addEventListener('mouseenter', (e) => {
      const a = el.dataset.a, b = el.dataset.b;
      const rec = getView(a, b);
      const clubA = clubInfos[a] || { name: prettifySlug(a), icon: DEFAULT_CLUB_ICON };
      const clubB = clubInfos[b] || { name: prettifySlug(b), icon: DEFAULT_CLUB_ICON };
      let view = rec.view;
      if (view && rec.flipped) {
        view = { status: view.status, boards: view.boards, timeClass: view.timeClass, url: view.url, scoreA: view.scoreB, scoreB: view.scoreA };
      }
      const rect = e.currentTarget.getBoundingClientRect();
      showPopover(rect.left + rect.width / 2, rect.top, popoverHTML(clubA, clubB, view));
    });
    el.addEventListener('mouseleave', hidePopover);
    el.addEventListener('mousemove', (e) => { if (popover.classList.contains('show')) positionPopover(e.clientX, e.clientY - 10); });
  });

  return { matchesDone, matchesTotal, gamesDone, gamesTotal };
}

function boot() {
  const content = document.getElementById('content');
  try {
    TOURNAMENT = parseTournamentData(TOURNAMENT_DATA);
  } catch (e) {
    content.innerHTML = '<div class="error-msg">⚠️ Could not parse TOURNAMENT_DATA: ' + (e.message || e) + '</div>';
    return;
  }
  if (!TOURNAMENT.rounds.length) {
    content.innerHTML = '<div class="error-msg">⚠️ No rounds found. Check the TOURNAMENT_DATA matrix at the top of the script.</div>';
    return;
  }
  activeRoundIdx = Math.max(0, TOURNAMENT.rounds.length - 1);
  renderRoundNav();
  renderActiveRound();
}

boot();
// refresh live scores/status every 5 minutes without touching the tournament structure
setInterval(() => {
  Object.keys(matchCache).forEach(k => delete matchCache[k]);
  renderActiveRound();
}, 300000);
</script>
</body>
</html>
